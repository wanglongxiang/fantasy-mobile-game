<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>幻唐仙缘 · 问道江湖</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1a1c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8F%AF%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05090b;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#e9ddc6;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center}
:root{
  --gold:#d9b06a;--gold-2:#f0d49a;--gold-dim:#8d7448;
  --paper:#f2e7cf;--muted:#9aa79e;
  --hp:#c8494f;--hp-2:#f2776d;--mp:#4a8fd0;--exp:#e0b74f;
  --card:rgba(22,36,40,.78);--card-2:rgba(30,48,48,.62);
  --line:rgba(217,176,106,.22);
  --app-h:100dvh;
}
#app{
  position:relative;width:100%;max-width:430px;height:var(--app-h);overflow:hidden;touch-action:manipulation;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(56,92,92,.45),transparent 60%),
    radial-gradient(100% 50% at 50% 100%,rgba(74,58,32,.35),transparent 65%),
    linear-gradient(180deg,#0c1620 0%,#101f27 40%,#122320 100%);
}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 70%);
}
#app::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px rgba(0,0,0,.7);
}
@media (min-width:560px) and (min-height:600px){
  body{background:radial-gradient(80% 60% at 50% 40%,#152322,#05090b 70%)}
  #app{height:min(860px,calc(100dvh - 40px));border-radius:38px;border:9px solid #1b211f;
    box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px rgba(217,176,106,.22),inset 0 0 0 1px rgba(0,0,0,.6)}
  #app::after{border-radius:30px}
}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

/* ============ 顶部状态栏 ============ */
#topbar{
  position:relative;z-index:5;flex:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,rgba(8,16,20,.92),rgba(10,20,24,.55) 70%,transparent);
}
.tb-badge{
  width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:21px;
  background:radial-gradient(circle at 35% 30%,#2c4a44,#101c1c);
  border:1px solid rgba(217,176,106,.55);box-shadow:0 0 12px rgba(217,176,106,.18),inset 0 0 10px rgba(0,0,0,.6);
}
.tb-main{flex:1;min-width:0}
.tb-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;white-space:nowrap}
.tb-name{font-size:14px;font-weight:600;color:#f4e9d2;letter-spacing:.5px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.tb-lv{font-size:10px;color:#0f1a18;background:linear-gradient(180deg,#f0d49a,#c9a25e);padding:1px 6px;border-radius:8px;font-weight:700}
.tb-sect{font-size:10px;color:#b9c8bb;border:1px solid rgba(217,176,106,.3);border-radius:8px;padding:1px 6px}
.bar{position:relative;height:9px;border-radius:6px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.bar>i{position:absolute;inset:0;width:100%;transform-origin:left;display:block;transition:width .3s ease}
.bar>span{position:absolute;inset:0;font-size:8px;line-height:9px;text-align:center;color:rgba(255,255,255,.92);text-shadow:0 1px 2px #000;letter-spacing:.3px}
.bar.hp>i{background:linear-gradient(90deg,#8e2f36,#d9565a)}
.bar.mp>i{background:linear-gradient(90deg,#2e5d8c,#5aa1e0)}
.bar+.bar{margin-top:3px}
.tb-gold{flex:none;text-align:right;font-size:12px;color:var(--gold-2);font-weight:600;line-height:1.3}
.tb-gold small{display:block;font-size:8px;color:#7f8f85;font-weight:400}
#expbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(0,0,0,.4)}
#expbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8d6b2c,#f0d49a);transition:width .4s}

/* ============ 屏幕 ============ */
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;position:relative;z-index:2;scroll-behavior:smooth;overscroll-behavior:contain}
.sec-title{display:flex;align-items:center;gap:8px;margin:16px 0 9px;font-family:"Songti SC","STSong",serif;font-size:15px;color:#e8d9b8;letter-spacing:2px}
.sec-title::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,#f0d49a,#8d6b2c)}
.sec-title small{margin-left:auto;font-family:inherit;font-size:10px;color:#7f8f85;letter-spacing:0}

/* 场景图 */
.scene{position:relative;height:168px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,12,14,.86))}
.scene .scene-txt{position:absolute;left:15px;bottom:12px;right:15px}
.scene .st-name{font-family:"Songti SC","STSong",serif;font-size:25px;letter-spacing:5px;color:#f7ecd4;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.scene .st-sub{font-size:10px;color:#c6b992;letter-spacing:1.5px;margin-top:2px}
.scene .st-tag{position:absolute;top:12px;right:12px;font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--gold-2)}

/* 卡片网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{
  position:relative;display:flex;align-items:center;gap:10px;padding:11px 10px;min-height:62px;
  border-radius:13px;background:linear-gradient(160deg,rgba(38,58,58,.7),rgba(16,28,30,.85));
  border:1px solid var(--line);text-align:left;transition:transform .12s,box-shadow .2s;
}
.tile:active{transform:scale(.97);box-shadow:0 0 18px rgba(217,176,106,.25)}
.tile .t-ico{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:20px;background:radial-gradient(circle at 35% 25%,rgba(240,212,154,.28),rgba(0,0,0,.35));border:1px solid rgba(217,176,106,.28)}
.tile .t-body{min-width:0;display:block}
.tile .t-name{display:block;font-size:13px;color:#f0e4ca;font-weight:600;letter-spacing:.5px}
.tile .t-desc{display:block;font-size:9.5px;color:#8fa093;margin-top:2px;line-height:1.35}
.tile .t-badge{position:absolute;top:6px;right:7px;font-size:8px;padding:1px 5px;border-radius:6px;background:#b7413f;color:#ffe9c9}

/* 按钮 */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;
  border-radius:12px;font-size:14px;font-weight:600;letter-spacing:1px;color:#f6ecd6;
  background:linear-gradient(180deg,rgba(64,92,84,.9),rgba(24,40,40,.95));
  border:1px solid rgba(217,176,106,.42);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .1s,filter .2s;
}
.btn:active{transform:scale(.96);filter:brightness(1.15)}
.btn.gold{background:linear-gradient(180deg,#e2c184,#b98f4c);color:#2a1f0c;border-color:#f4dcae;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);color:#c9d3c9}
.btn.danger{background:linear-gradient(180deg,rgba(120,50,50,.85),rgba(60,24,24,.95));border-color:rgba(200,90,80,.5)}
.btn:disabled{opacity:.4;filter:grayscale(.5)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;min-width:44px;font-size:12px;padding:0 12px;border-radius:9px}

/* 列表行 */
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,.06);margin-bottom:8px}
.row .r-ico{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:21px;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(217,176,106,.2)}
.row .r-main{flex:1;min-width:0}
.row .r-name{font-size:13px;color:#eee2c8;display:flex;align-items:center;gap:6px}
.row .r-desc{font-size:10px;color:#8b9a90;margin-top:2px;line-height:1.4}
.row .r-right{flex:none;text-align:right}
.tag{font-size:9px;padding:1px 6px;border-radius:6px;border:1px solid rgba(217,176,106,.35);color:#d9b06a}
.tag.on{background:rgba(217,176,106,.18)}
.tag.off{color:#6f7d75;border-color:rgba(255,255,255,.12)}
.empty{padding:28px 10px;text-align:center;color:#6f7d75;font-size:12px;line-height:1.8}

/* 进度条（任务） */
.pbar{height:6px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:6px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#8d6b2c,#e8c47c);transition:width .3s}

/* ============ 底部导航 ============ */
#tabbar{
  position:relative;z-index:6;flex:none;display:flex;
  padding:4px 6px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,18,20,.6),rgba(8,14,16,.98) 40%);
  border-top:1px solid rgba(217,176,106,.18);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:52px;border-radius:11px;color:#7d8d84;font-size:10px;letter-spacing:1px;position:relative;transition:color .2s;
}
.tab i{font-style:normal;font-size:20px;line-height:1;filter:grayscale(.55);transition:.2s}
.tab.on{color:#f0d49a}
.tab.on i{filter:none;transform:translateY(-1px);text-shadow:0 0 12px rgba(240,212,154,.65)}
.tab.on::after{content:"";position:absolute;bottom:2px;width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#f0d49a,transparent)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 17px);width:6px;height:6px;border-radius:50%;background:#e2564f;box-shadow:0 0 6px #e2564f}

/* ============ 弹层 ============ */
#overlay{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,7,9,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .18s ease}
#overlay.center{align-items:center;padding:20px}
.sheet{
  width:100%;max-height:88%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius:20px 20px 0 0;border:1px solid rgba(217,176,106,.28);border-bottom:none;
  background:linear-gradient(180deg,#182a2c,#0e1a1c 70%);
  box-shadow:0 -14px 50px rgba(0,0,0,.7);animation:sheetUp .24s cubic-bezier(.2,.9,.3,1);
}
#overlay.center .sheet{border-radius:18px;border-bottom:1px solid rgba(217,176,106,.28);max-width:340px;animation:pop .2s ease}
.sheet h3{margin:0 0 4px;font-family:"Songti SC","STSong",serif;font-size:19px;letter-spacing:3px;color:#f4e7ca;text-align:center}
.sheet .sub{text-align:center;font-size:10px;color:#83938a;margin-bottom:14px;letter-spacing:1px}
.sheet .sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet .sheet-actions .btn{flex:1}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 选择门派 */
.sect-card{display:flex;gap:11px;padding:11px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);margin-bottom:8px;text-align:left;width:100%;transition:.15s}
.sect-card.sel{border-color:rgba(240,212,154,.85);background:rgba(217,176,106,.12);box-shadow:0 0 18px rgba(217,176,106,.16)}
.sect-card .sc-ico{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:23px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(0,0,0,.4));border:1px solid rgba(217,176,106,.3)}
.sect-card .sc-name{display:block;font-size:14px;color:#f2e6cc;font-family:"Songti SC","STSong",serif;letter-spacing:2px}
.sect-card .sc-motto{font-size:9px;color:#c8b385;margin:1px 0 3px;letter-spacing:1px}
.sect-card .sc-desc{font-size:9.5px;color:#8c9c92;line-height:1.45}

.input{
  width:100%;min-height:44px;padding:0 12px;border-radius:10px;background:rgba(0,0,0,.4);
  border:1px solid rgba(217,176,106,.3);color:#f2e6cc;font-size:16px;outline:none;text-align:center;letter-spacing:2px;
  font-family:inherit;
}
.input:focus{border-color:rgba(240,212,154,.8);box-shadow:0 0 14px rgba(217,176,106,.2)}

/* ============ 战斗 ============ */
#battle{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  background:
    radial-gradient(80% 45% at 50% 62%,rgba(90,110,80,.35),transparent 70%),
    radial-gradient(60% 40% at 50% 10%,rgba(70,110,120,.3),transparent 70%),
    linear-gradient(180deg,#0a1418,#12211f 55%,#0b1512);
  animation:fadeIn .25s ease;
}
#battle .b-art{position:absolute;inset:0;pointer-events:none;opacity:.85}
#battle .b-art svg{position:absolute;inset:0;width:100%;height:100%}
#battle .fog{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse 60% 12% at 20% 70%,rgba(200,220,210,.16),transparent 70%),
             radial-gradient(ellipse 60% 10% at 80% 55%,rgba(200,220,210,.12),transparent 70%)}
#battle .b-round{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 4px;font-size:10px;color:#a9b8ae;letter-spacing:1px}
#battle .b-round b{color:#f0d49a;font-weight:600}
#battle .b-round .auto{margin-left:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;min-height:44px;min-width:88px;border-radius:22px;
  border:1px solid rgba(217,176,106,.3);background:rgba(0,0,0,.35);font-size:10px;color:#9fb0a5}
#battle .b-round .auto.on{color:#0f1a18;background:linear-gradient(180deg,#f0d49a,#c9a25e);border-color:#f4dcae;font-weight:700}
#battle .b-log{position:relative;z-index:2;flex:none;height:22px;padding:0 14px;font-size:10.5px;color:#c7d3c8;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.5px}
#battle .b-log span{color:#f0d49a}
.enemy-area{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.unit{position:relative;width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:12px;transition:.2s;flex:none}
.unit .u-av{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  background:radial-gradient(circle at 38% 30%,rgba(190,215,200,.35),rgba(10,20,20,.75) 70%);
  border:1px solid rgba(217,176,106,.3);box-shadow:inset 0 -6px 12px rgba(0,0,0,.5)}
.enemy .u-av{border-color:rgba(200,120,110,.4);background:radial-gradient(circle at 38% 30%,rgba(230,170,150,.3),rgba(30,14,14,.8) 70%)}
.unit .u-name{font-size:9.5px;color:#dcd0b6;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .u-name em{font-style:normal;color:#8fa093;font-size:8.5px}
.unit .u-hp{width:72px;height:5px;border-radius:3px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.unit .u-hp>i{display:block;height:100%;background:linear-gradient(90deg,#8e2f36,#e0635f);transition:width .25s}
.unit .u-hp.ally>i{background:linear-gradient(90deg,#2f7a52,#67c288)}
.unit .u-num{font-size:8px;color:#86988c;letter-spacing:.2px;line-height:1}
.unit.sel{background:rgba(217,176,106,.1);box-shadow:0 0 0 1px rgba(240,212,154,.7),0 0 18px rgba(217,176,106,.25)}
.unit.sel::before{content:"▼";position:absolute;top:-11px;font-size:10px;color:#f0d49a;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}}
.unit.act .u-av{transform:translateY(-6px) scale(1.06);box-shadow:0 0 22px rgba(240,212,154,.5)}
.unit .u-av{transition:transform .18s,box-shadow .2s}
.unit .u-tag{position:absolute;top:-2px;right:2px;font-size:8px;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(217,176,106,.3);color:#e8cf9c}
.vs-line{position:relative;z-index:2;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 0;color:#6f8176;font-size:9px;letter-spacing:3px}
.vs-line::before,.vs-line::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,rgba(217,176,106,.35),transparent)}
.ally-area{position:relative;z-index:2;flex:none;display:flex;justify-content:center;gap:22px;padding:0 10px 6px}
.floater{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:20px;font-weight:800;pointer-events:none;
  color:#ffd9a1;text-shadow:0 2px 6px #000,0 0 12px rgba(255,140,90,.6);animation:floatUp 1s ease-out forwards;z-index:9;font-family:"Songti SC",serif}
.floater.heal{color:#8ef0b0;text-shadow:0 2px 6px #000,0 0 12px rgba(90,240,150,.6)}
.floater.crit{font-size:24px;color:#ffb066}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(.95)}}
.combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:"Songti SC",serif;font-size:26px;letter-spacing:6px;color:#ffe4ae;text-shadow:0 0 24px rgba(255,190,90,.8),0 3px 10px #000;pointer-events:none;animation:comboIn 1s ease forwards;z-index:12;white-space:nowrap}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

.cmd-wrap{position:relative;z-index:2;flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,16,18,.2),rgba(6,12,14,.92) 40%);border-top:1px solid rgba(217,176,106,.16)}
.cmd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;letter-spacing:1px;color:#ece0c8;background:linear-gradient(170deg,rgba(46,68,62,.92),rgba(18,30,30,.96));
  border:1px solid rgba(217,176,106,.3);transition:transform .1s,filter .2s}
.cmd i{font-style:normal;font-size:17px;line-height:1}
.cmd small{font-size:8px;color:#8fa093}
.cmd:active{transform:scale(.95);filter:brightness(1.2)}
.cmd:disabled{opacity:.35}
.cmd.run{color:#c9a9a0;border-color:rgba(190,120,110,.3)}
.panel{max-height:168px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-bottom:2px}
.opt{display:flex;align-items:center;gap:7px;min-height:44px;padding:6px 9px;border-radius:10px;text-align:left;
  background:rgba(40,60,56,.6);border:1px solid rgba(217,176,106,.22);font-size:11px;color:#e5dac2}
.opt:active{background:rgba(70,96,86,.8)}
.opt:disabled{opacity:.35}
.opt .oi{font-size:16px}
.opt .oname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .ocost{font-size:9px;color:#7fb6e0}
.opt.back{grid-column:1/-1;justify-content:center;color:#9fb0a5;background:rgba(255,255,255,.04);min-height:36px}

/* 结果 */
.result{text-align:center;padding:8px 4px}
.result .rttl{font-family:"Songti SC",serif;font-size:30px;letter-spacing:8px;color:#f6e3b6;text-shadow:0 0 24px rgba(240,196,120,.55)}
.result .rsub{font-size:10px;color:#8d9c92;letter-spacing:2px;margin-top:2px}
.reward-grid{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.rw{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;background:rgba(217,176,106,.1);border:1px solid rgba(217,176,106,.28);font-size:11px;color:#f0d9a8}

/* toast */
#toasts{position:absolute;left:0;right:0;top:24%;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:9px 17px;border-radius:20px;background:rgba(8,16,18,.94);border:1px solid rgba(230,195,132,.45);font-size:12.5px;color:#f0e3c6;
  box-shadow:0 8px 26px rgba(0,0,0,.65);animation:toastIn .2s ease;max-width:86%;text-align:center;transition:opacity .18s,transform .18s}
.toast.bad{border-color:rgba(210,110,100,.55);color:#ffc9bd}
.toast.good{border-color:rgba(120,210,150,.45);color:#c6f0cf}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* 角色页 */
.hero-head{display:flex;align-items:center;gap:14px;padding:16px 14px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(56,84,76,.55),rgba(14,26,28,.9));position:relative;overflow:hidden}
.hero-head::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(240,212,154,.16),transparent 65%)}
.hero-av{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;
  background:radial-gradient(circle at 35% 28%,#3c6258,#101c1c);border:2px solid rgba(240,212,154,.5);box-shadow:0 0 20px rgba(240,212,154,.2)}
.hero-info h2{margin:0;font-family:"Songti SC","STSong",serif;font-size:20px;letter-spacing:3px;color:#f6ead0}
.hero-info p{margin:3px 0 0;font-size:10px;color:#a5b5a9;letter-spacing:1px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:11px;color:#9faea2}
.stat b{color:#f0e4c8;font-weight:600;font-size:12px}
.equip-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);margin-bottom:7px;font-size:11px;color:#93a399}
.equip-row>span:first-child{flex:none;width:54px;white-space:nowrap}
.equip-row .eq-name{flex:1;color:#e6d9bd}
.skill-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;margin:0 6px 6px 0;border-radius:9px;
  background:rgba(217,176,106,.09);border:1px solid rgba(217,176,106,.25);font-size:10.5px;color:#e8d6ae}

/* 横屏手机：压缩战斗布局，避免敌方单位被裁切 */
@media (orientation:landscape) and (max-height:520px){
  body{background:radial-gradient(80% 60% at 50% 40%,#152322,#05090b 70%)}
  #app{max-width:520px}
  .scene{height:132px}
  #battle .b-round{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:2px}
  .b-log{height:16px;font-size:9.5px}
  .enemy-area{padding:0 6px}
  .unit{width:78px;gap:2px;padding:2px}
  .unit .u-av{width:44px;height:44px;font-size:24px}
  .unit .u-hp{width:64px}
  .unit .u-name{font-size:9px}
  .unit .u-num{font-size:7px}
  .vs-line{padding:1px 0;font-size:8px}
  .ally-area{gap:16px;padding-bottom:2px}
  .cmd-wrap{padding:6px 10px calc(4px + env(safe-area-inset-bottom))}
  .cmd{min-height:42px;font-size:11px}
  .cmd i{font-size:15px}
  .cmd small{font-size:7px}
  .panel{max-height:120px}
  .sheet{max-height:94%}
  #overlay.center .sheet{max-height:92%}
  .hero-head{padding:10px}
}

/* ===================== 手感层：按压反馈 / 字阶 / 过渡 ===================== */
button,[data-act]{transition:transform .08s ease,filter .12s ease,opacity .12s ease;touch-action:manipulation;-webkit-user-select:none}
button:active,[data-act]:active{transform:scale(.955);filter:brightness(1.16)}
button:disabled,[aria-disabled="true"]{opacity:.32;filter:grayscale(.75);transform:none!important}
.btn{min-height:50px;border-radius:14px;font-size:15px}
.btn.sm{min-height:44px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.tile{min-height:74px;border-radius:16px}
.tile .t-name{font-size:15px}
.tile .t-desc{font-size:12px;line-height:1.45}
.row{padding:12px 13px;border-radius:14px}
.row .r-name{font-size:14.5px}
.row .r-desc{font-size:14px;line-height:1.5}
.sec-title{font-size:16px;margin:18px 0 10px}
.tb-name{font-size:15px}
.tb-lv{font-size:11px;padding:1px 7px}
.tb-sect{font-size:11px}
.tb-badge{padding:0}
.bar{height:10px;border-radius:6px}
.bar>span{font-size:9px;line-height:10px}
.tab{font-size:11px;min-height:56px}
.tab i{font-size:22px}
.scene .st-name{font-size:28px}
.scene .st-sub{font-size:11.5px}
.hero-info p{font-size:12px}
.hero-info h2{font-size:21px}
.equip-row{font-size:12.5px;padding:11px 12px}
.skill-chip{font-size:12px;padding:7px 11px}
.empty{font-size:14px;line-height:1.9}
.sheet h3{font-size:20px}
.sheet .sub{font-size:11px}
.sect-card{padding:12px}
.sect-card .sc-name{font-size:16px}
.sect-card .sc-desc{font-size:11.5px;line-height:1.5}
.stat{font-size:12.5px;padding:10px 12px}
.stat b{font-size:13.5px}
.equip-row .eq-name{font-size:13px}

/* 页面切换 / 场景淡入 */
#screen.fade-in{animation:screenIn .2s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.scene{animation:sceneIn .3s ease}
@keyframes sceneIn{from{opacity:.15}to{opacity:1}}
#overlay{animation:fadeIn .12s ease}
.sheet{animation:sheetUp .16s cubic-bezier(.2,.9,.3,1)}
#overlay.center .sheet{animation:pop .16s ease}

/* 页面小标题栏 */
.pagebar{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.pagebar .ptitle{font-family:"Songti SC","STSong",serif;font-size:20px;letter-spacing:4px;color:#f4e7ca}
.pagebar .pmuted{margin-left:auto;font-size:12px;color:#8fa093}
.pagebar .back{min-height:44px;min-width:52px;font-size:13px}

/* 主城场景热点 */
.town-scene{height:252px}
.hotspot{position:absolute;bottom:16px;width:68px;height:68px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.22),rgba(10,20,18,.88) 72%);
  border:1px solid rgba(240,212,154,.55);box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 0 12px rgba(0,0,0,.5);
  font-size:26px;line-height:1}
.hotspot b{font-size:11px;font-weight:600;color:#f6ead0;text-shadow:0 1px 3px #000;margin-top:1px;letter-spacing:.5px}
.hotspot .dotp{position:absolute;top:0;right:0;width:11px;height:11px;border-radius:50%;background:#e2564f;box-shadow:0 0 9px #e2564f;animation:pulse 1.6s infinite}
.hotspot:active{transform:scale(.9)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}
.hotspot-label{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:rgba(246,234,208,.75);letter-spacing:1px}

/* 战斗手感 */
.unit .u-hp>i{transition:width .38s cubic-bezier(.2,.8,.25,1)}
.unit.ally.act{transform:translateY(-16px) scale(1.1)}
.unit.enemy.act{transform:translateY(14px) scale(1.1)}
.unit.hit .u-av{animation:hitFlash .2s ease}
@keyframes hitFlash{0%{filter:brightness(2.4) saturate(.3)}100%{filter:none}}
.unit{animation:unitIn .32s cubic-bezier(.2,.9,.3,1) backwards}
.enemy-area .unit:nth-child(2){animation-delay:.06s}
.enemy-area .unit:nth-child(3){animation-delay:.12s}
.ally-area .unit:nth-child(2){animation-delay:.14s}
@keyframes unitIn{from{opacity:0;transform:translateY(18px) scale(.82)}to{opacity:1;transform:none}}
.slash{position:absolute;left:50%;top:50%;width:64px;height:3px;margin:-1px 0 0 -32px;border-radius:2px;pointer-events:none;z-index:9;
  background:linear-gradient(90deg,transparent,#fff6dc,transparent);box-shadow:0 0 10px rgba(255,214,150,.9);
  animation:slashAnim .26s ease-out forwards}
@keyframes slashAnim{0%{opacity:0;transform:rotate(-32deg) scaleX(.2)}35%{opacity:1}100%{opacity:0;transform:rotate(-32deg) scaleX(1.15)}}
.floater{font-size:22px}
.floater.crit{font-size:30px;color:#ffcf7a;text-shadow:0 0 20px rgba(255,170,70,.95),0 3px 8px #000}
.floater.heal{font-size:21px}
.unit .u-num{font-size:8.5px;color:#8fa093}
.combo{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;left:0;transform:none;
  background:linear-gradient(90deg,transparent,rgba(8,16,14,.88),transparent);padding:10px 0}
.combo b{font-family:"Songti SC","STSong",serif;font-weight:400;font-size:27px;letter-spacing:7px;color:#ffe4ae;text-shadow:0 0 24px rgba(255,190,90,.85),0 3px 10px #000}
.combo small{font-size:10px;letter-spacing:3px;color:#0f1a18;background:linear-gradient(180deg,#f0d49a,#c9a25e);padding:2px 7px;border-radius:6px;font-weight:700}
@keyframes comboIn{0%{opacity:0;transform:scale(1.12)}18%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.b-intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:11;
  background:radial-gradient(circle,rgba(6,12,14,.55),transparent 62%);animation:introFade 1s ease forwards}
.b-intro span{font-family:"Songti SC","STSong",serif;font-size:34px;letter-spacing:12px;color:#f6e3b6;text-shadow:0 0 30px rgba(240,196,120,.7),0 4px 14px #000;transform:translateX(6px)}
@keyframes introFade{0%{opacity:0}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
.result .rttl{animation:winIn .38s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#battle .b-round .auto{min-height:44px;min-width:56px;padding:0 10px}
#battle .b-round .auto + .auto{margin-left:0}
#battle .b-round{gap:6px;flex-wrap:nowrap;font-size:11px}
#battle .b-round .speed{font-variant-numeric:tabular-nums}

/* 创角名字卡片 */
.name-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.name-chip{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045);
  color:#e8dcc2;font-size:14px;letter-spacing:1px}
.name-chip.sel{border-color:rgba(240,212,154,.85);background:rgba(217,176,106,.16);color:#fff3d8;box-shadow:0 0 16px rgba(217,176,106,.18)}

/* ===================== 大世界 ===================== */
#screen.world-screen{padding:0;overflow:hidden;position:relative}
#screen:not(.world-screen){padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.world{position:absolute;inset:0;overflow:hidden;background:#0a1210;touch-action:none}
.world-art{position:absolute;left:0;top:0;will-change:transform}
.world-art>svg{display:block}
.w-entity{position:absolute;transform:translate(-50%,-70%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:4}
.w-entity:active{transform:translate(-50%,-70%) scale(.94)!important;filter:brightness(1.18)}
.w-entity .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:27px;
  background:radial-gradient(circle at 36% 26%,rgba(255,255,255,.22),rgba(12,22,19,.9) 70%);
  border:1px solid rgba(240,212,154,.55);box-shadow:0 8px 18px rgba(0,0,0,.6);position:relative}
.w-entity .nm{font-size:11px;line-height:1.4;color:#f3e6c9;background:rgba(7,14,12,.75);padding:1px 7px;border-radius:9px;white-space:nowrap;border:1px solid rgba(240,212,154,.18)}
.w-npc .ring{position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(240,212,154,.35);animation:ringPulse 2.6s infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.09);opacity:.15}}
.w-mon .av{border-color:rgba(226,110,90,.55);background:radial-gradient(circle at 36% 26%,rgba(255,180,150,.2),rgba(28,12,10,.92) 70%);animation:monBob 2.2s ease-in-out infinite}
.w-mon .nm{color:#f0c0b2;border-color:rgba(226,110,90,.3)}
@keyframes monBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.w-chest .av{width:46px;height:46px;font-size:24px;border-color:rgba(240,212,154,.7);animation:chestGlow 2.4s ease-in-out infinite}
@keyframes chestGlow{0%,100%{box-shadow:0 0 0 rgba(240,190,90,0)}50%{box-shadow:0 0 22px rgba(240,190,90,.55)}}
.w-portal .av{width:76px;height:76px;font-size:34px;border-color:rgba(120,220,200,.6);background:radial-gradient(circle,rgba(70,190,170,.35),rgba(6,16,14,.9) 72%);animation:portalSpin 6s linear infinite}
@keyframes portalSpin{0%{box-shadow:0 0 18px rgba(90,220,190,.35)}50%{box-shadow:0 0 34px rgba(90,220,200,.7)}100%{box-shadow:0 0 18px rgba(90,220,190,.35)}}
.w-portal .nm{color:#bfeee2;border-color:rgba(120,220,200,.35)}

.hero-lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.hero-lock .h-shadow{position:absolute;bottom:20px;width:52px;height:12px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(4px)}
.hero-lock .h-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:31px;
  background:radial-gradient(circle at 36% 26%,#4c6a5c,#16241f 72%);border:2px solid rgba(240,212,154,.75);
  box-shadow:0 0 0 4px rgba(240,212,154,.12),0 10px 24px rgba(0,0,0,.6);position:relative;transition:transform .12s}
.hero-lock .h-nm{font-size:11px;color:#f6ead0;background:rgba(7,14,12,.8);padding:1px 8px;border-radius:9px;border:1px solid rgba(240,212,154,.25)}
.hero-lock.walk .h-av{animation:heroBob .4s ease-in-out infinite alternate}
@keyframes heroBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}

.joy{position:absolute;left:14px;bottom:calc(80px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;z-index:22;touch-action:none;
  background:radial-gradient(circle,rgba(255,255,255,.09),rgba(0,0,0,.4) 74%);border:1px solid rgba(240,212,154,.35);box-shadow:inset 0 0 24px rgba(0,0,0,.5)}
.joy .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 28%,#f7e6bb,#b98f4f 74%);box-shadow:0 5px 14px rgba(0,0,0,.65);transition:transform .07s}
.joy .joy-hint{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:10px;color:#8fa093;letter-spacing:1px}
@media (max-width:360px){.joy{width:108px;height:108px;left:12px}.joy .knob{width:48px;height:48px;margin:-24px 0 0 -24px}}

.world-top{position:absolute;left:10px;right:10px;top:8px;z-index:16;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.world-top>*{pointer-events:auto}
.w-scene{display:flex;flex-direction:column;gap:1px;padding:6px 11px;border-radius:12px;background:rgba(8,15,13,.7);border:1px solid rgba(240,212,154,.24);backdrop-filter:blur(4px)}
.w-scene b{font-size:13px;color:#f4e7ca;letter-spacing:1px}
.w-scene span{font-size:10px;color:#8fa093}
.w-quest{flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(8,15,13,.7);border:1px solid rgba(240,212,154,.18);min-width:0}
.w-quest .qt{flex:1;min-width:0}
.w-quest .qt b{display:block;font-size:12px;color:#e8d6ae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-quest .qt span{display:block;font-size:10px;color:#8fa093;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-quest button{min-height:44px;min-width:52px;border-radius:10px;font-size:12px;padding:0 10px;background:linear-gradient(180deg,#e3c07c,#b98f4f);color:#1a1410;font-weight:700;border:0}

.w-act{position:absolute;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:23;min-height:50px;padding:0 18px;border-radius:25px;
  background:linear-gradient(180deg,#3c6353,#1a2c25);border:1px solid rgba(240,212,154,.55);color:#f6ead0;font-size:13px;
  box-shadow:0 10px 24px rgba(0,0,0,.55);animation:actIn .16s ease}
@keyframes actIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.w-fade{position:absolute;inset:0;background:#050a09;opacity:0;pointer-events:none;z-index:40;transition:opacity .22s ease}
.w-fade.on{opacity:1}

}

  mix-blend-mode:overlay;
}
#app::after{box-shadow:inset 0 0 80px rgba(0,0,0,.72),inset 0 0 0 1px rgba(230,195,132,.06)}

/* ---------- 顶栏 ---------- */
#topbar{
  padding:calc(7px + env(safe-area-inset-top)) 12px 8px;gap:10px;
  background:
    linear-gradient(180deg,rgba(9,19,16,.96),rgba(11,24,20,.82) 66%,rgba(11,24,20,.35));
  border-bottom:1px solid rgba(230,195,132,.18);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
#topbar::after{
  content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(230,195,132,.55),transparent);
}
.tb-badge{
  width:48px;height:48px;border-radius:14px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 20%,#39594d,#101d1a 75%);
  border:2px solid rgba(230,195,132,.7);
  box-shadow:0 0 0 3px rgba(12,24,20,.9),0 0 18px rgba(230,195,132,.22),inset 0 0 10px rgba(0,0,0,.5);
}
.tb-badge img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;transform:scale(1.5);transform-origin:50% 18%}
.tb-badge .tb-cap{
  position:absolute;right:-2px;bottom:-2px;min-width:18px;height:16px;padding:0 3px;border-radius:8px;
  display:grid;place-items:center;font-size:10px;font-weight:700;color:#20180a;
  background:linear-gradient(180deg,#f6e2af,#c9a25e);border:1px solid #f8e7bb;
}
.tb-main{flex:1;min-width:0}
.tb-row{gap:6px;margin-bottom:5px}
.tb-name{font-size:15px;letter-spacing:1px;color:#f7ecd6;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:104px}
.tb-lv{
  font-family:"Songti SC","STSong",serif;font-size:11px;letter-spacing:.5px;padding:1px 7px;border-radius:6px;
  color:#241a08;background:linear-gradient(180deg,#f8e7bb,#c9a25e);border:1px solid rgba(255,245,215,.7);
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.tb-sect{font-size:10.5px;color:#c3d2bd;background:rgba(255,255,255,.05);border:1px solid rgba(230,195,132,.28);padding:1px 7px;border-radius:6px}
.bar{height:11px;border-radius:7px;background:rgba(4,10,8,.8);border:1px solid rgba(0,0,0,.65);box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.bar>i{position:relative;border-radius:6px}
.bar>i::after{
  content:"";position:absolute;inset:0;border-radius:6px;
  background:
    repeating-linear-gradient(90deg,transparent 0 24%,rgba(0,0,0,.32) 24% 25%),
    linear-gradient(180deg,rgba(255,255,255,.42),transparent 52%,rgba(0,0,0,.18));
}
.bar>span{font-size:9px;line-height:11px;letter-spacing:.4px;color:#fff8e6;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.bar.hp{height:12px}.bar.hp>i{background:linear-gradient(90deg,#8d2b33,#dc5a5c 62%,#ff9a86)}
.bar.mp{height:9px}.bar.mp>i{background:linear-gradient(90deg,#27517d,#4f96db 70%,#8ed0ff)}
.bar.mp>span{font-size:8px;line-height:9px}
.bar+.bar{margin-top:3px}
.tb-gold{
  flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  font-size:12.5px;font-weight:600;color:var(--gold-2);line-height:1.15;letter-spacing:.4px;
}
.tb-gold b{display:flex;align-items:center;gap:3px;font-weight:600}
.tb-gold small{font-size:9px;color:#93a396;font-weight:400}
#expbar{height:3px;background:rgba(0,0,0,.5)}
#expbar>i{background:linear-gradient(90deg,#8d6b2c,#f8e7bb);box-shadow:0 0 8px rgba(248,231,187,.55)}

/* ---------- 底栏 ---------- */
#tabbar{
  padding:5px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,20,17,.72),rgba(8,16,14,.985) 45%);
  border-top:1px solid rgba(230,195,132,.22);
  box-shadow:0 -8px 26px rgba(0,0,0,.45);
}
.tab{
  min-height:56px;font-size:11px;letter-spacing:1px;color:#8b9c8e;border-radius:13px;gap:3px;
}
.tab i{font-size:0;display:grid;place-items:center;filter:none}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tab.on{color:#f8e7bb;background:radial-gradient(circle at 50% 120%,rgba(230,195,132,.22),transparent 70%)}
.tab.on svg{filter:drop-shadow(0 0 7px rgba(248,231,187,.6))}
.tab.on::after{bottom:3px;width:22px;height:2px;background:linear-gradient(90deg,transparent,#f8e7bb,transparent);box-shadow:0 0 8px rgba(248,231,187,.8)}
.tab .dot{top:8px;right:calc(50% - 18px)}
.tab:active{background:rgba(230,195,132,.08)}

/* ---------- 通用标题 / 文本 ---------- */
.sec-title{font-size:15px;letter-spacing:2px;color:#f0dfb6;margin:18px 0 10px;gap:9px}
.sec-title::before{width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,#f8e7bb,#9a7639);box-shadow:0 0 8px rgba(230,195,132,.5)}
.sec-title small{font-size:11px;color:#8b9c8e}
.pagebar{padding:4px 0 12px;gap:9px}
.pagebar .ptitle{font-size:22px;letter-spacing:5px;color:#f7ecd6;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.pagebar .pmuted{font-size:12px;color:#9aab9c}
.empty{font-size:13px;line-height:1.9;color:#8b9c8e;padding:24px 10px}

/* ---------- 卡片 / 列表 ---------- */
.row{
  padding:12px;border-radius:var(--r-m);margin-bottom:9px;
  background:linear-gradient(160deg,rgba(40,62,54,.9),rgba(15,28,24,.95));
  border:1px solid var(--card-line);
  box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;
}
.row::after{content:"";position:absolute;inset:0;background-image:var(--paper-tex);opacity:.16;pointer-events:none;mix-blend-mode:overlay}
.row:active{transform:scale(.985);filter:brightness(1.06)}
.row .r-ico{
  width:44px;height:44px;border-radius:12px;font-size:23px;
  background:radial-gradient(circle at 38% 26%,rgba(255,255,255,.18),rgba(8,18,15,.7) 72%);
  border:1px solid rgba(230,195,132,.32);
  box-shadow:inset 0 0 10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
.row .r-name{font-size:14.5px;color:#f3e8cf;letter-spacing:.4px;gap:7px}
.row .r-desc{font-size:12.5px;color:#a2b1a3;line-height:1.5;margin-top:3px}
.row .r-right{flex:none}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid rgba(230,195,132,.4);color:#e6c384;letter-spacing:.4px}
.tag.on{background:rgba(230,195,132,.18);color:#f8e7bb;border-color:rgba(248,231,187,.6)}
.tag.off{color:#7f8f83;border-color:rgba(255,255,255,.12)}
.pbar{height:7px;border-radius:4px;background:rgba(3,9,7,.75);margin-top:7px;border:1px solid rgba(0,0,0,.5)}
.pbar>i{background:linear-gradient(90deg,#8d6b2c,#f0d49a);box-shadow:0 0 8px rgba(240,212,154,.4);border-radius:4px}
.grid2{gap:10px}
.tile{
  min-height:76px;padding:12px 11px;border-radius:var(--r-m);
  background:linear-gradient(160deg,rgba(42,66,56,.82),rgba(13,26,22,.92));
  border:1px solid var(--card-line);
  box-shadow:0 6px 16px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.05);
  gap:10px;overflow:hidden;
}
.tile .t-ico{
  width:40px;height:40px;border-radius:11px;font-size:22px;
  background:radial-gradient(circle at 36% 26%,rgba(240,212,154,.26),rgba(8,17,14,.72) 74%);
  border:1px solid rgba(230,195,132,.3);
}
.tile .t-name{font-size:15px;color:#f4e9d1}
.tile .t-desc{font-size:12px;color:#9dae9f}
.tile:active{box-shadow:0 0 20px rgba(230,195,132,.3)}

/* ---------- 按钮 ---------- */
.btn{
  min-height:50px;border-radius:13px;font-size:15px;letter-spacing:1.5px;
  background:linear-gradient(180deg,rgba(62,92,80,.96),rgba(21,38,33,.98));
  border:1px solid rgba(230,195,132,.45);
  box-shadow:0 5px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);
  color:#f4e9d1;position:relative;overflow:hidden;
}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 46%);opacity:.5;pointer-events:none}
.btn.gold{
  background:linear-gradient(180deg,#f4dda6,#cfa764 46%,#a67c3f);color:#2a1f0a;
  border-color:#fbeecb;text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:0 6px 18px rgba(0,0,0,.42),0 0 18px rgba(230,195,132,.22),inset 0 1px 0 rgba(255,255,255,.6);
}
.btn.ghost{background:rgba(255,255,255,.045);border-color:rgba(230,195,132,.24);color:#c6d2c4}
.btn.sm{min-height:44px;font-size:13px;border-radius:11px;letter-spacing:.6px}
.btn.danger{background:linear-gradient(180deg,rgba(126,54,52,.9),rgba(58,22,22,.96));border-color:rgba(210,110,100,.5)}
.btn:disabled{opacity:.38}

/* ---------- 场景卡（秘境） ---------- */
.scene{height:180px;border-radius:var(--r-l);border:1px solid rgba(230,195,132,.34);box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
.scene .veil{background:linear-gradient(180deg,transparent 38%,rgba(5,12,10,.9))}
.scene .st-name{font-size:27px;letter-spacing:6px;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 30px rgba(230,195,132,.2)}
.scene .st-sub{font-size:12px;color:#d6c39a;letter-spacing:2px}
.scene .st-tag{top:12px;right:12px;font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(6,14,11,.66);border:1px solid rgba(230,195,132,.4);color:#f8e7bb;backdrop-filter:blur(3px)}
.town-scene{height:262px}
.hotspot{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(170deg,rgba(52,78,66,.95),rgba(9,19,16,.95));
  border:1px solid rgba(230,195,132,.55);
  box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);
  font-size:24px;line-height:1;
}
.hotspot b{font-size:11px;color:#f8e7bb;margin-top:2px}
.hotspot:active{transform:translateY(2px) scale(.94)}
.hotspot-label{font-size:10px;color:rgba(246,235,210,.8)}

/* ---------- 弹层：卷轴 ---------- */
#overlay{background:rgba(3,8,6,.78);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{
  border-radius:20px 20px 0 0;border:1px solid rgba(230,195,132,.4);border-bottom:none;
  background:
    linear-gradient(180deg,rgba(44,66,56,.97),rgba(12,24,20,.99) 62%),
    var(--paper-tex);
  background-blend-mode:normal,overlay;
  box-shadow:0 -18px 60px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.05);
  padding:22px 16px calc(20px + env(safe-area-inset-bottom));
  position:relative;
}
.sheet::before{
  content:"";position:absolute;left:14px;right:14px;top:7px;height:5px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#a67c3f,#f8e7bb,#a67c3f,transparent);
  opacity:.75;box-shadow:0 0 10px rgba(230,195,132,.4);
}
.sheet::after{
  content:"";position:absolute;inset:14px 10px 10px;border-radius:14px;pointer-events:none;
  background-image:var(--cloud),var(--cloud),var(--cloud),var(--cloud);
  background-repeat:no-repeat;
  background-position:left top,right top,left bottom,right bottom;
  background-size:40px 40px;opacity:.5;
}
#overlay.center{padding:18px}
#overlay.center .sheet{
  border-radius:var(--r-l);border-bottom:1px solid rgba(230,195,132,.4);
  max-width:352px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;
}
.gender-inline{margin-left:auto;display:flex;gap:6px}
.name-chip.gender{min-height:32px;padding:0 11px;font-size:12px;border-radius:9px}
.sect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.sect-card.compact{padding:8px;flex-direction:column;align-items:center;gap:3px;text-align:center;margin:0}
.sect-card.compact .sc-ico{width:34px;height:34px;font-size:18px}
.sect-card.compact .sc-name{font-size:14px;letter-spacing:2px}
.sect-card.compact .sc-motto{font-size:9.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sheet h3{font-size:21px;letter-spacing:4px;color:#f8e7bb;margin-bottom:5px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sheet .sub{font-size:11.5px;color:#a3b3a4;letter-spacing:1.5px;margin-bottom:14px}
.sheet .sheet-actions{margin-top:16px;gap:10px}
.sheet .sheet-actions .btn{flex:1}
.sheet .sheet-actions.sticky{
  position:sticky;bottom:-12px;z-index:3;margin:12px -4px -6px;padding:12px 4px 8px;
  background:linear-gradient(180deg,rgba(14,26,22,0),rgba(12,24,20,.97) 42%);
}
.sheet .close-x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;color:#c9d6c8;font-size:17px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
#overlay.center .sheet::-webkit-scrollbar{width:0}
@keyframes sheetUp{from{transform:translateY(102%)}to{transform:translateY(0)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
#overlay{animation:fadeIn .14s ease}
#overlay .sheet{animation:sheetUp .18s cubic-bezier(.2,.9,.3,1)}
#overlay.center .sheet{animation:pop .16s cubic-bezier(.2,.9,.3,1)}

/* ---------- 创角 ---------- */
.sect-card{
  padding:12px;border-radius:var(--r-m);margin-bottom:9px;gap:12px;
  background:linear-gradient(160deg,rgba(40,62,54,.9),rgba(14,26,22,.96));
  border:1px solid rgba(230,195,132,.2);
}
.sect-card.sel{border-color:rgba(248,231,187,.9);background:linear-gradient(160deg,rgba(66,96,80,.95),rgba(18,32,27,.98));box-shadow:0 0 20px rgba(230,195,132,.2),inset 0 0 0 1px rgba(248,231,187,.25)}
.sect-card .sc-ico{width:46px;height:46px;border-radius:50%;font-size:24px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.22),rgba(0,0,0,.42));border:1px solid rgba(230,195,132,.4)}
.sect-card .sc-name{font-size:15px;letter-spacing:3px;color:#f7ecd6}
.sect-card .sc-motto{font-size:10.5px;color:#d3ba85;letter-spacing:1px;margin:2px 0 4px}
.sect-card .sc-desc{font-size:12px;color:#a2b1a3;line-height:1.55}
.name-chips{gap:8px;margin-bottom:8px}
.name-chip{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid rgba(230,195,132,.22);background:rgba(255,255,255,.045);color:#e8dcc2;font-size:13.5px}
.name-chip.sel{border-color:rgba(248,231,187,.9);background:rgba(230,195,132,.16);color:#fff5dc;box-shadow:0 0 14px rgba(230,195,132,.2)}
.input{min-height:48px;border-radius:11px;font-size:16px;border:1px solid rgba(230,195,132,.35)}

/* ---------- 角色页 ---------- */
.hero-head{padding:16px;border-radius:var(--r-l);border:1px solid rgba(230,195,132,.3);background:linear-gradient(150deg,rgba(52,80,66,.7),rgba(12,24,20,.94));gap:14px;overflow:hidden}
.hero-head::after{width:170px;height:170px;right:-40px;top:-60px;background:radial-gradient(circle,rgba(240,212,154,.18),transparent 62%)}
.hero-av{width:82px;height:96px;border-radius:14px;overflow:hidden;border:2px solid rgba(230,195,132,.7);background:radial-gradient(circle at 50% 26%,#3a5c4c,#0e1c18 76%);box-shadow:0 0 22px rgba(230,195,132,.2),inset 0 0 14px rgba(0,0,0,.5)}
.hero-av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.25);transform-origin:50% 20%}
.hero-info h2{font-size:22px;letter-spacing:3px}
.hero-info p{font-size:12px;color:#a9b8ab;margin-top:4px}
.stat-grid{gap:8px}
.stat{padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid rgba(230,195,132,.16);font-size:12.5px;color:#9faea2}
.stat b{font-size:14px;color:#f3e8cf;font-variant-numeric:tabular-nums}
.equip-row{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(230,195,132,.16);font-size:12.5px;color:#9dae9f;margin-bottom:8px}
.equip-row .eq-name{font-size:13.5px;color:#eee2c8}
.skill-chip{padding:7px 11px;border-radius:9px;font-size:12.5px;border:1px solid rgba(230,195,132,.28);background:rgba(230,195,132,.1);color:#f0dfb6;gap:6px}

/* ---------- 世界 ---------- */
#screen.world-screen{padding:0}
.world{background:#0d1a16}
.w-entity{
  transform:translate(-50%,-88%);gap:3px;z-index:5;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));
}
.w-entity .spr{height:88px;width:auto;display:block;image-rendering:auto;pointer-events:none}
.w-entity .spr.mon{height:74px}
.w-entity .spr.chest{height:52px}
.w-entity .nm{
  font-size:11px;padding:2px 9px;border-radius:10px;
  background:linear-gradient(180deg,rgba(12,24,20,.92),rgba(8,16,13,.9));
  border:1px solid rgba(230,195,132,.36);color:#f4e9d1;letter-spacing:.5px;
  box-shadow:0 3px 8px rgba(0,0,0,.5);white-space:nowrap;
}
.w-npc .nm{color:#f8e7bb}
.w-mon .nm{color:#f3c2b4;border-color:rgba(220,110,90,.45)}
.w-entity .mark{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  color:#241a08;background:linear-gradient(180deg,#f8e7bb,#c9a25e);border:1px solid #fff3d4;
  box-shadow:0 2px 8px rgba(0,0,0,.5);animation:markBob 1.8s ease-in-out infinite;
}
@keyframes markBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.w-mon .mark{background:linear-gradient(180deg,#f0a08c,#c25a4a);color:#fff3e2;border-color:#ffd9cf}
.w-npc .spr{animation:npcBreath 3.4s ease-in-out infinite}
@keyframes npcBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.w-entity:active{transform:translate(-50%,-88%) scale(.95)!important}
.hero-lock{transform:translate(-50%,-62%);gap:3px;z-index:8}
.hero-lock .h-shadow{width:64px;height:15px;bottom:14px;background:rgba(0,0,0,.55);filter:blur(5px)}
.hero-lock .h-spr{height:104px;width:auto;filter:drop-shadow(0 8px 7px rgba(0,0,0,.55));transition:transform .12s}
.hero-lock .h-nm{font-size:11px;padding:2px 9px;border-radius:9px;background:rgba(8,16,13,.86);border:1px solid rgba(230,195,132,.4);color:#f8e7bb;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.hero-lock.walk .h-spr{animation:heroBob .42s ease-in-out infinite alternate}
@keyframes heroBob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6px) rotate(1.5deg)}}
.joy{
  left:16px;bottom:calc(12px + env(safe-area-inset-bottom));width:128px;height:128px;z-index:22;
  background:
    radial-gradient(circle at 50% 50%,rgba(230,195,132,.12),rgba(4,12,9,.42) 62%,rgba(4,10,8,.2) 70%),
    radial-gradient(circle,rgba(255,255,255,.06),rgba(0,0,0,.28) 76%);
  border:1.5px solid rgba(230,195,132,.45);
  box-shadow:inset 0 0 26px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.4);
}
.joy::before{
  content:"";position:absolute;inset:9px;border-radius:50%;
  border:1px dashed rgba(230,195,132,.28);
}
.joy .knob{
  width:58px;height:58px;margin:-29px 0 0 -29px;
  background:radial-gradient(circle at 36% 26%,#fff6da,#e0be80 46%,#9a7639 100%);
  border:1.5px solid #fff3d4;
  box-shadow:0 6px 16px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.7);
}
.joy .joy-hint{bottom:5px;font-size:9px;color:rgba(240,225,195,.5);letter-spacing:2px}
.world-top{left:10px;right:10px;top:8px;gap:7px;flex-direction:column;align-items:stretch}
.world-top-row{display:flex;gap:7px;align-items:flex-start}
.w-scene{
  padding:7px 12px;border-radius:12px;gap:1px;
  background:linear-gradient(180deg,rgba(14,28,23,.9),rgba(8,17,14,.82));
  border:1px solid rgba(230,195,132,.34);backdrop-filter:blur(6px);
  box-shadow:0 5px 14px rgba(0,0,0,.4);
}
.w-scene b{font-family:"Songti SC",serif;font-size:15px;letter-spacing:2px;color:#f8e7bb}
.w-scene span{font-size:10px;color:#9fb0a1;letter-spacing:1px}
.w-quest{
  flex:1;padding:7px 9px;border-radius:12px;gap:8px;
  background:linear-gradient(180deg,rgba(14,28,23,.9),rgba(8,17,14,.82));

}

.w-quest .qt span{font-size:10.5px;color:#97a899;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px}

.w-quest button{

}
.w-tip{

  text-shadow:0 1px 3px #000;
}

/* ---------- 战斗 ---------- */
#battle{background:linear-gradient(180deg,#0a1714,#16261f 58%,#0a1310);animation:fadeIn .2s ease}
#battle .b-art{opacity:1}
#battle .after{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 34% at 50% 48%,rgba(255,236,190,.08),transparent 70%)}
#battle .b-round{

}
#battle .b-round .rlabel{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#d8c7a0}
#battle .b-round b{color:#f8e7bb;font-family:"Songti SC",serif;font-size:15px}
#battle .b-round .auto{
  min-height:40px;min-width:auto;padding:0 11px;border-radius:12px;font-size:11px;

}
#battle .b-round .auto.on{background:linear-gradient(180deg,#f4dda6,#cfa764);color:#241a08;font-weight:700;border-color:#fbeecb}
#battle .b-log{
  height:26px;padding:0 14px;font-size:11.5px;color:#cbd7c8;letter-spacing:.3px;
  display:flex;align-items:center;
}
#battle .b-log span{color:#f8e7bb}
.enemy-area{flex:1;min-height:0;align-items:flex-end;padding:0 8px 6px;gap:2px}
.unit{
  width:104px;gap:4px;padding:5px 2px;border-radius:14px;
}
.unit .u-art{
  width:100%;height:96px;display:grid;place-items:end center;position:relative;
}
.unit .u-art img{height:96px;width:auto;max-width:104px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));transition:transform .15s}
.unit.enemy .u-art img{height:84px}
.unit .u-shadow{position:absolute;bottom:-2px;width:66px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.62),rgba(0,0,0,0) 72%);filter:blur(2px)}
.unit .u-art .spr{width:116px;height:106px}
.unit.enemy .u-art .spr{width:108px;height:98px}
.unit .u-art img{height:104px}
.unit .u-art .spr svg{width:100%;height:100%}
.row .r-ico svg{width:100%;height:100%;display:block}
.unit .u-name{
  padding:2px 9px;border-radius:9px;font-size:10.5px;color:#f2e4c4;gap:4px;max-width:100px;
  background:rgba(6,14,11,.78);border:1px solid rgba(230,195,132,.3);box-shadow:0 2px 7px rgba(0,0,0,.45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.unit .u-name em{font-size:9px;color:#e8c88a;font-style:normal;letter-spacing:.2px}
.unit .u-hp{
  width:96px;height:11px;border-radius:6px;background:rgba(3,8,6,.86);

}
.unit .u-hp>i{height:100%;background:linear-gradient(180deg,#e8695f,#c03a43 55%,#8d2b33);border-radius:5px;transition:width .3s}

.unit .u-hp::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;

}
.unit .u-hp::after{

}
.unit .u-num{font-size:9.5px;color:#cfdccf;letter-spacing:.2px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.unit .u-stat{display:flex;gap:3px;min-height:15px}
.unit .st-ico{

  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.4);
}
.st-ico.poison{background:rgba(86,150,74,.42);border-color:#8fd07a}
.st-ico.burn{background:rgba(180,84,40,.45);border-color:#ffa268}
.st-ico.stun{background:rgba(190,168,60,.42);border-color:#ffe07a}
.st-ico.shield{background:rgba(70,120,180,.45);border-color:#9cd0ff}
.unit.sel{background:radial-gradient(circle at 50% 60%,rgba(230,195,132,.16),transparent 70%);box-shadow:none}
.unit.sel::before{content:"▼";top:-4px;color:#f8e7bb;text-shadow:0 0 10px rgba(248,231,187,.9)}
.unit.sel .u-art img{filter:drop-shadow(0 0 10px rgba(248,231,187,.65)) drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.unit.act .u-art img{transform:translateY(-8px) scale(1.08)}
.unit.hit .u-art img{animation:hitFlash .22s ease}
@keyframes hitFlash{0%{filter:brightness(2.6) saturate(.2) drop-shadow(0 0 14px #fff)}100%{filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}}
.unit.hit .u-art::after{
  content:"";position:absolute;left:50%;top:40%;width:88px;height:88px;pointer-events:none;z-index:3;
  transform:translate(-50%,-50%);background:url("assets/fx/hit.png") center/contain no-repeat;
  mix-blend-mode:screen;animation:fxBurst .3s ease-out both;
}
@keyframes fxBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(24deg)}
}
.unit.dead{opacity:.22;filter:grayscale(1)}
.unit.dead .u-art img{transform:translateY(6px) rotate(8deg)}
.vs-line{padding:2px 0 4px;font-size:9px;letter-spacing:5px;color:#7f9187}
.vs-line::before,.vs-line::after{width:44px;background:linear-gradient(90deg,transparent,rgba(230,195,132,.3),transparent)}
.ally-area{gap:26px;padding:0 8px 4px}
.cmd-wrap{
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,16,14,.1),rgba(6,13,11,.94) 34%);
  border-top:1px solid rgba(230,195,132,.18);
  box-shadow:0 -10px 30px rgba(0,0,0,.35);
}
.cmd-grid{grid-template-columns:repeat(3,1fr);gap:9px}
.cmd{
  min-height:62px;border-radius:16px;font-size:12.5px;gap:3px;letter-spacing:.6px;
  background:linear-gradient(170deg,rgba(54,84,70,.95),rgba(16,30,25,.98));
  border:1px solid rgba(230,195,132,.32);
  box-shadow:0 5px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09);
}
.cmd i{font-size:0;display:grid;place-items:center}
.cmd svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cmd small{font-size:9.5px;color:#93a596}
.cmd.run{color:#e2c0b8;border-color:rgba(200,120,110,.35)}
.cmd:active{filter:brightness(1.2)}
.turn-wait{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;color:#c9b98e;font-size:12.5px;letter-spacing:3px}
.turn-wait i{width:7px;height:7px;border-radius:50%;background:#f0d49a;box-shadow:0 0 10px rgba(240,212,154,.8);animation:waitPulse .9s ease-in-out infinite}
@keyframes waitPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.cmd-wrap{position:relative}
.panel{
  position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);max-height:216px;gap:8px;z-index:9;
  padding:10px;border-radius:16px;border:1px solid rgba(230,195,132,.35);
  background:linear-gradient(170deg,rgba(30,48,40,.985),rgba(9,19,16,.99));
  box-shadow:0 12px 34px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  animation:pop .14s ease;
}
.opt{
  min-height:52px;padding:8px 10px;border-radius:12px;font-size:12.5px;
  background:linear-gradient(160deg,rgba(48,74,62,.92),rgba(16,30,25,.96));
  border:1px solid rgba(230,195,132,.28);color:#ece0c8;
}
.opt .oi{font-size:0;display:grid;place-items:center}
.opt .oi svg{width:20px;height:20px;stroke:#f8e7bb;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt .ocost{color:#8fc3e8}
.opt .ocost.mp{color:#9ec9ec}
.opt.back{min-height:44px;background:rgba(255,255,255,.05);color:#a9b8aa;border-color:rgba(255,255,255,.14)}
.floater{
  top:30px;z-index:6;
  font-family:"Songti SC",serif;font-size:24px;font-weight:700;color:#fff1cc;
  -webkit-text-stroke:.7px rgba(40,14,6,.85);
  text-shadow:0 2px 6px #000,0 0 16px rgba(255,150,80,.75);
}
.floater.crit{font-size:34px;color:#ffcf7a;text-shadow:0 3px 8px #000,0 0 26px rgba(255,160,60,1)}
.floater.heal{color:#9df0b4;text-shadow:0 2px 6px #000,0 0 16px rgba(90,240,150,.7)}
.combo{
  top:34%;padding:12px 0;background:linear-gradient(90deg,transparent,rgba(10,20,16,.92) 18%,rgba(10,20,16,.92) 82%,transparent);
}
.combo b{font-size:30px;letter-spacing:9px;color:#ffe9bd;text-shadow:0 0 26px rgba(255,190,90,.9),0 3px 12px #000}
.combo small{background:linear-gradient(180deg,#f8e7bb,#c9a25e);color:#231a08;font-size:10px;letter-spacing:2px}
.b-intro{background:radial-gradient(circle,rgba(6,13,11,.62),transparent 64%)}
.b-intro span{font-size:36px;letter-spacing:14px;color:#f8e7bb;text-shadow:0 0 34px rgba(240,196,120,.8),0 4px 16px #000}
.result .rttl{font-size:33px;letter-spacing:9px;color:#f8e7bb;text-shadow:0 0 26px rgba(240,196,120,.6)}
.result .rsub{font-size:11.5px;color:#9aab9c;letter-spacing:2px}
.rw{padding:7px 11px;border-radius:10px;font-size:12px;border:1px solid rgba(230,195,132,.32);background:rgba(230,195,132,.1);color:#f4e4c0}
.reward-grid{gap:9px;margin:16px 0 4px}

/* 状态提示小字 */
.hintline{font-size:11px;color:#8b9c8e;line-height:1.6}
.qname{font-size:10px;padding:0 4px;border-radius:4px;border:1px solid currentColor;opacity:.95}
.r-right svg,.pmuted svg,.empty svg,.hintline svg,.tb-sect svg{fill:none;stroke:currentColor;stroke-width:1.8;width:16px;height:16px;vertical-align:-3px;stroke-linecap:round;stroke-linejoin:round}
.row .r-ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn svg,.hotspot svg,.equip-row svg,.tb-gold svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.btn svg{margin-right:2px}
.tb-gold svg{width:15px;height:15px;margin-right:2px;vertical-align:-3px;color:#f0d49a}
.hotspot svg{width:26px;height:26px;stroke:#f8e7bb}
.equip-row svg{width:16px;height:16px;color:#e6c384}

/* 世界实体素材 */
.spr{display:block;line-height:0}
.w-entity .spr{width:82px;height:82px}
.w-entity .spr.mon{width:86px;height:86px}
.w-entity .spr.obj{width:58px;height:58px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(170deg,rgba(52,78,66,.95),rgba(9,19,16,.95));border:1px solid rgba(230,195,132,.5);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.w-entity .spr.obj svg{width:30px;height:30px}
.w-entity .spr.chest svg,.w-entity .spr.portal svg{width:100%;height:100%;stroke:#f8e7bb;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.w-entity .spr.chest{width:44px;height:44px;padding:5px;border-radius:12px;background:rgba(12,26,20,.55);border:1px solid rgba(230,195,132,.35);box-shadow:0 0 18px rgba(240,190,90,.25)}
.w-entity .spr.portal{width:62px;height:62px;padding:6px;border-radius:50%;background:radial-gradient(circle,rgba(90,200,180,.28),rgba(6,16,14,.7) 72%);border:1px solid rgba(120,220,200,.55);box-shadow:0 0 24px rgba(90,220,200,.35);animation:portalSpin 4s ease-in-out infinite}
.w-entity .spr svg.mon-svg{width:100%;height:100%}
.mon-svg{display:block}

/* 角色朝向 */
.hero-lock .h-spr{transform:scaleX(var(--flip,1))}
@keyframes heroBob{from{transform:scaleX(var(--flip,1)) translateY(0)}to{transform:scaleX(var(--flip,1)) translateY(-6px)}}

/* 创角立绘 */
.create-stage{display:flex;align-items:flex-end;gap:14px;padding:8px 12px;border-radius:14px;
  background:radial-gradient(80% 90% at 30% 100%,rgba(90,132,108,.35),rgba(10,22,18,.5) 70%);border:1px solid rgba(230,195,132,.25);
  box-shadow:inset 0 0 26px rgba(0,0,0,.35);margin-bottom:6px;min-height:112px;overflow:hidden}
.create-stage img{width:96px;height:106px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.create-info{flex:1;min-width:0;padding-bottom:10px}
.create-info b{display:block;font-family:"Songti SC",serif;font-size:20px;letter-spacing:3px;color:#f8e7bb}
.create-info span{display:block;margin-top:4px;font-size:11.5px;color:#b9c8b8;letter-spacing:1px}

/* 对话 */
.talk{display:flex;gap:12px;align-items:flex-start}
.talk-portrait{width:92px;flex:none;position:relative}
.talk-portrait img{width:92px;height:128px;object-fit:contain;object-position:bottom;
  border-radius:12px;border:1px solid rgba(230,195,132,.35);
  background:radial-gradient(70% 80% at 50% 90%,rgba(96,140,110,.35),rgba(9,20,16,.5) 70%);padding:4px}
.talk-lv{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9px;letter-spacing:1px;
  padding:1px 7px;border-radius:8px;background:rgba(9,20,16,.9);border:1px solid rgba(230,195,132,.35);color:#d8c39a;white-space:nowrap}
.talk-body{flex:1;min-width:0}
.talk-name{font-family:"Songti SC",serif;font-size:16px;letter-spacing:3px;color:#f8e7bb;margin-bottom:7px}
.talk-text{font-size:14.5px;line-height:1.8;color:#e9dcc0;min-height:82px;text-indent:1.5em}
.talk-dots{display:flex;gap:5px;margin:10px 0 2px}
.talk-dots i{width:6px;height:6px;border-radius:50%;background:rgba(230,195,132,.22)}
.talk-dots i.on{background:#f0d49a;box-shadow:0 0 8px rgba(240,212,154,.7)}

/* 活跃度 */
.act-card{padding:12px;border-radius:14px;margin-bottom:10px;
  background:linear-gradient(160deg,rgba(52,78,64,.75),rgba(13,26,22,.94));border:1px solid rgba(230,195,132,.28)}
.act-head{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.act-head b{font-family:"Songti SC",serif;font-size:15px;letter-spacing:2px;color:#f8e7bb}
.act-head span{font-size:11px;color:#8fa093}
.act-chests{display:flex;gap:9px;margin-top:11px}
.act-chest{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:6px 0;
  border-radius:11px;border:1px solid rgba(230,195,132,.22);background:rgba(255,255,255,.04);color:#8fa093}
.act-chest span{width:26px;height:26px;display:grid;place-items:center}
.act-chest svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.act-chest b{font-size:10.5px;letter-spacing:.5px}
.act-chest.ok{border-color:rgba(248,231,187,.65);color:#f8e7bb;background:rgba(230,195,132,.14);box-shadow:0 0 14px rgba(230,195,132,.2)}
.act-chest.done{color:#7f8f83;opacity:.6}
.act-chest:disabled{opacity:.55}

/* 窄屏 / 矮屏适配 */
@media (max-width:360px){
  .w-entity .spr{height:76px}.w-entity .spr.mon{height:64px}
  .hero-lock .h-spr{height:90px}
  .unit{width:86px}.unit .u-art{height:84px}.unit .u-art img{height:84px}.unit.enemy .u-art img{height:74px}
  .unit .u-hp{width:70px}
  .cmd{min-height:58px;font-size:12px}
  .tab{font-size:10px}.tab svg{width:21px;height:21px}
  .tb-badge{width:44px;height:44px}
  .joy{width:112px;height:112px}
}
@media (max-height:700px){
  .create-stage{display:none}
  .sheet h3{font-size:19px}
  .sheet .sub{display:none}
  .sec-title{margin:10px 0 6px}
  .sheet{padding-top:18px;max-height:92%!important}
  #overlay.center .sheet{max-height:92%}
  .sect-card.compact .sc-motto{display:none}
  .sect-card.compact{padding:6px}
  .sect-card.compact .sc-ico{width:28px;height:28px;font-size:15px}
  .name-chip{min-height:36px}
  .sheet .sheet-actions .btn{min-height:46px}
}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:560px}
  .world-top{flex-direction:column}
  .cmd{min-height:52px}
  .unit .u-art{height:74px}.unit .u-art img{height:74px}.unit.enemy .u-art img{height:66px}
  .scene{height:130px}
}

</style>

<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
  <nav id="tabbar"></nav>
  <section id="battle" class="hidden"></section>
  <div id="overlay" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script>
/* ===================== 基础工具 ===================== */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
const STAT_KEYS = ['hp', 'mp', 'atk', 'def', 'mag', 'mdef', 'spd'];
const STAT_NAMES = { hp: '气血', mp: '法力', atk: '攻击', def: '防御', mag: '灵力', mdef: '法防', spd: '速度' };
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

/* ===================== 视觉素材 / 图标 ===================== */
const SPRITE_OF = { tiance: 'tang', longgong: 'han', putuo: 'qing', wanshou: 'yuan' };
const charSprite = (sect, gender) => `assets/chars/${SPRITE_OF[sect] || 'han'}_${gender === 'f' ? 'f' : 'm'}.png`;
const playerSprite = () => charSprite(S.player.sect, S.player.gender);
const npcSprite = n => n.sprite ? `assets/chars/${n.sprite}.png` : charSprite('tiance', 'm');

const QUALITY = {
  white: { name: '凡品', c: '#cfd6cb', bg: 'rgba(207,214,203,.12)' },
  green: { name: '灵品', c: '#8ee0a4', bg: 'rgba(110,220,140,.13)' },
  blue: { name: '玄品', c: '#7fc4ff', bg: 'rgba(90,160,255,.14)' },
  purple: { name: '仙品', c: '#d7a6ff', bg: 'rgba(180,110,255,.16)' }
};
const qOf = id => QUALITY[(ITEMS[id] && ITEMS[id].q) || 'white'];
function itemIcon(id) {
  const it = ITEMS[id] || {};
  if (it.type === 'book') return 'scroll';
  if (it.type === 'potion') return it.exp ? 'star' : 'potion';
  if (it.slot === 'weapon') return 'sword';
  if (it.slot === 'armor') return 'shield';
  if (it.slot === 'trinket') return 'spark';
  return 'bag';
}
function qStyle(id) { const q = qOf(id); return `style="border-color:${q.c}55;box-shadow:inset 0 0 0 1px ${q.c}22,0 6px 16px rgba(0,0,0,.28)"`; }
function qName(id) { const q = qOf(id); return `<span class="qname" style="color:${q.c}">${q.name}</span>`; }

/* ===================== 妖兽立绘（统一粗描边卡通） ===================== */
function monArt(spId, cls = '') {
  const sp = SPECIES[spId] || {};
  const a = sp.art || { k: 'beast', c1: '#8a9a6a', c2: '#5c6a44' };
  const c1 = a.c1, c2 = a.c2, c3 = a.c3 || '#f6e6c4', ink = '#20180f', eye = '#1b140e';
  const eyes = (x, y, r = 3.2) => `<g><ellipse cx="${x - 8}" cy="${y}" rx="${r}" ry="${r + .8}" fill="${eye}"/><ellipse cx="${x + 8}" cy="${y}" rx="${r}" ry="${r + .8}" fill="${eye}"/>
    <circle cx="${x - 9}" cy="${y - 1.2}" r="1.1" fill="#fff" opacity=".9"/><circle cx="${x + 7}" cy="${y - 1.2}" r="1.1" fill="#fff" opacity=".9"/></g>`;
  let body = '';
  if (a.k === 'spirit') {
    body = `<path d="M50 18c15 0 24 12 24 26 0 10-4 18-9 24-3 4-3 8 0 12 3 5 1 10-4 10-4 0-6-3-8-6-2 4-5 6-8 6-3 0-5-2-5-5 0-2 1-4 3-7-3-1-5-4-5-8 0-3 2-6 4-8-4-5-6-11-6-18 0-14 9-26 24-26Z" fill="${c1}" stroke="${ink}" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M50 24c8 0 14 6 15 15-6-4-12-3-15 2-3-5-9-6-15-2 1-9 7-15 15-15Z" fill="${c3}" opacity=".85"/>
      ${eyes(50, 46)}<path d="M46 58q4 4 8 0" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  } else if (a.k === 'snake') {
    body = `<path d="M22 78c-6-12 2-22 14-22h20c8 0 12-5 10-11-2-7-11-8-16-4" stroke="${c1}" stroke-width="17" fill="none" stroke-linecap="round"/>
      <path d="M22 78c-6-12 2-22 14-22h20c8 0 12-5 10-11-2-7-11-8-16-4" stroke="${c2}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".6"/>
      <ellipse cx="60" cy="34" rx="17" ry="13" fill="${c1}" stroke="${ink}" stroke-width="3"/>
      <path d="M45 30h-8l4 5Z" fill="${c2}" stroke="${ink}" stroke-width="2"/>
      ${eyes(62, 31, 2.4)}<path d="M64 41q5 3 9 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M70 42l2 6-5-2Z" fill="#f2f0e4" stroke="${ink}" stroke-width="1.4"/>`;
  } else if (a.k === 'bug') {
    body = `<ellipse cx="50" cy="58" rx="20" ry="23" fill="${c1}" stroke="${ink}" stroke-width="3.2"/>
      <path d="M50 36c-8 10-8 34 0 44 8-10 8-34 0-44Z" fill="${c2}" opacity=".55"/>
      <ellipse cx="30" cy="50" rx="13" ry="18" fill="#e9f2df" stroke="${ink}" stroke-width="2.6" opacity=".85" transform="rotate(-22 30 50)"/>
      <ellipse cx="70" cy="50" rx="13" ry="18" fill="#e9f2df" stroke="${ink}" stroke-width="2.6" opacity=".85" transform="rotate(22 70 50)"/>
      <path d="M40 38l-8-12M60 38l8-12" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="31" cy="25" r="2.6" fill="${c3}" stroke="${ink}" stroke-width="1.6"/><circle cx="69" cy="25" r="2.6" fill="${c3}" stroke="${ink}" stroke-width="1.6"/>
      ${eyes(50, 52, 3)}<path d="M50 60v14" stroke="${ink}" stroke-width="2.2"/>`;
  } else if (a.k === 'stone') {
    body = `<path d="M28 82V52l8-20 14-8 16 8 8 20v30Z" fill="${c1}" stroke="${ink}" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M36 50l10-12 8 6-6 12Z" fill="${c2}" opacity=".7"/>
      <path d="M58 40l10 6-2 10-10-4Z" fill="${c2}" opacity=".5"/>
      <path d="M28 82h44" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
      ${eyes(50, 52, 2.8)}
      <path d="M42 64h16" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M74 30l8-6M78 44l8 2" stroke="${c3}" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>`;
  } else if (a.k === 'ghost') {
    body = `<path d="M50 22c12 0 21 10 21 24v30c0 4-4 6-7 3l-5-5-5 6c-2 3-6 3-8 0l-5-6-5 5c-3 3-7 1-7-3V46c0-14 9-24 21-24Z" fill="${c1}" stroke="${ink}" stroke-width="3.2" stroke-linejoin="round" opacity=".94"/>
      ${eyes(50, 44, 3.2)}<path d="M44 58q6 6 12 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M34 30q-4-8 4-10M66 30q4-8-4-10" stroke="${c2}" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".8"/>`;
  } else if (a.k === 'fish') {
    body = `<path d="M26 54c10-16 34-20 48-8 6 5 9 10 9 12s-3 7-9 12c-14 12-38 8-48-8-2-3-2-5 0-8Z" fill="${c1}" stroke="${ink}" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M83 58l10-10v20Z" fill="${c2}" stroke="${ink}" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M44 42l8-14 8 14Z" fill="${c2}" stroke="${ink}" stroke-width="2.6" stroke-linejoin="round"/>
      ${eyes(36, 52, 3)}
      <path d="M30 62q7 4 13 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  } else if (a.k === 'demon') {
    body = `<path d="M50 24c14 0 24 10 24 23 0 8-3 14-8 18v13c0 3-3 5-6 4l-10-4-10 4c-3 1-6-1-6-4V65c-5-4-8-10-8-18 0-13 10-23 24-23Z" fill="${c1}" stroke="${ink}" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M30 28 18 12l2 20M70 28l12-16-2 20" fill="${c2}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M34 58q16 10 32 0" stroke="${ink}" stroke-width="2.6" fill="none"/>
      ${eyes(50, 44, 3.4)}
      <path d="M22 72l-6 10M78 72l6 10" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
      <circle cx="50" cy="34" r="4" fill="${c3}" opacity=".7"/>`;
  } else {
    body = `<ellipse cx="48" cy="62" rx="25" ry="18" fill="${c1}" stroke="${ink}" stroke-width="3.2"/>
      <circle cx="68" cy="44" r="16" fill="${c1}" stroke="${ink}" stroke-width="3.2"/>
      <path d="M56 34 52 22l12 6M80 34l6-12 4 14" fill="${c2}" stroke="${ink}" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M73 52h10l-5 6Z" fill="${c3}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>
      ${eyes(68, 42, 2.7)}
      <path d="M24 58q-10-8-6-16 3 8 12 8" fill="${c2}" stroke="${ink}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M36 80v10M56 80v10M44 56q-8 8-4 14" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  }
  return `<svg class="mon-svg ${cls}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="90" rx="27" ry="6" fill="rgba(0,0,0,.32)"/>${body}</svg>`;
}
