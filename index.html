function floatText(txt,color,size,where){
  const host=$('#battle');if(!host)return;
  let x=50,y=42;
  if(where==='hero'){const el=$('#hero');if(el){const r=el.getBoundingClientRect(),h=host.getBoundingClientRect();x=(r.left-h.left+r.width/2)/h.width*100;y=(r.top-h.top)/h.height*100}}
  else{
    const el=$('#enemies').children[B.target];if(el){const r=el.getBoundingClientRect(),h=host.getBoundingClientRect();x=(r.left-h.left+r.width/2)/h.width*100;y=(r.top-h.top+r.height*.3)/h.height*100}
  }
  const d=document.createElement('div');
  d.className='float';d.textContent=txt;d.style.color=color;d.style.fontSize=size+'px';
  d.style.left=x+'%';d.style.top=y+'%';
  host.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function banner(txt){
  const d=document.createElement('div');d.className='banner';
  d.innerHTML='<div class="bt">'+txt+'</div><div class="bl"></div>';
  d.style.top='30%';
  $('#battle').appendChild(d);setTimeout(()=>d.remove(),1200);
}
function buffMult(o,k){return o.buffs[k]?1+o.buffs[k].v:1}
function tickBuffs(o,isPlayer){
  Object.keys(o.buffs).forEach(k=>{
    const b=o.buffs[k];
    if(!b)return;
    if(k==='burn'||k==='poison'){
      const dmg=Math.max(8,Math.round((isPlayer?stats().hp:o.maxHp)*(k==='burn'?.055:.045)));
      o.hp-=dmg;
      floatText((k==='burn'?'灼 ':'毒 ')+dmg,k==='burn'?'#ff9a7a':'#b6e86a',15,isPlayer?'hero':'enemy');
    }
    b.t--;
    if(b.t<=0)delete o.buffs[k];
  });
  if(o.hp<=0)o.hp=0;
}
function dealDamage(src,dst,pw,opts){
  opts=opts||{};
  let base=src.atk*pw-dst.def*.55;
  base*=rand(.92,1.08);
  if(opts.atkBuff)base*=(1+opts.atkBuff);
  if(dst.buffs.freeze)base*=1.15;
  if(dst.buffs.armor)base*=1.12;
  base=Math.max(6,base);
  let crit=Math.random()<(src.crit||.08)+ (opts.crit||0);
  if(crit)base*=1.85;
  base=Math.round(base);
  if(dst.buffs.shield){const s=dst.buffs.shield;if(s.v>=base){s.v-=base;base=0}else{base-=s.v;delete dst.buffs.shield}}
  dst.hp=Math.max(0,dst.hp-base);
  return {dmg:base,crit};
}
function playerAct(ski){
  if(!B||B.busy||B.over)return;
  tickBuffs(B.p,true);
  updateBars();
  if(B.p.hp<=0)return loseBattle();
  const st=stats();
  const sk=SECTS[S.sect].skills;
  const isBasic=ski<0;
  const cost=isBasic?0:sk[ski].mp;
  if(!isBasic&&B.p.mp<cost)return toast('法力不足');
  B.busy=true;B.p.mp-=cost;
  const hero=$('#hero');if(hero){hero.classList.add('atk');setTimeout(()=>hero.classList.remove('atk'),480)}
  const s=sk[isBasic?0:ski];
  let target=B.enemies[B.target];
  if(!target||target.dead||target.hp<=0){B.target=B.enemies.findIndex(e=>!e.dead&&e.hp>0);target=B.enemies[B.target]}
  if(!target){B.busy=false;return}
  if(!isBasic)banner(s.n);
  const bt=B;
  setTimeout(()=>{
    if(B!==bt)return;
    if(s.t==='heal'){
      const heal=Math.round(st.atk*s.pw*1.4+B.p.hp*.02);
      B.p.hp=Math.min(st.hp,B.p.hp+heal);
      floatText('+'+heal,'#8fe0bd',19,'hero');
      B.p.buffs.regen={t:3,v:.05};
    }else if(s.t==='buff'){
      B.p.buffs[s.buff==='atk'?'atkBuff':'defBuff']={t:3,v:s.buff==='atk'?.35:.4};
      floatText(s.buff==='atk'?'攻击提升':'护体真气','#f6e2b0',15,'hero');
      if(S.sect==='shou'){B.p.hp=Math.min(st.hp,B.p.hp+Math.round(st.atk*.8));}
    }else{
      const pw=(isBasic?1:s.pw)*(1+(S.skLv[isBasic?0:ski]-1)*.06);
      const opts={atkBuff:B.p.buffs.atkBuff?B.p.buffs.atkBuff.v:0,crit:isBasic?0:.05};
      const r=dealDamage({atk:st.atk,crit:st.crit},target,pw,opts);
      showHit(B.target,r);
      if(s.eff){
        const chance={stun:.45,freeze:.5,burn:.75,poison:.7,armor:.8}[s.eff]||.6;
        if(Math.random()<chance){
          target.buffs[s.eff]={t:3,v:0};
          floatText({stun:'眩晕',freeze:'冰封',burn:'灼烧',poison:'中毒',armor:'破甲'}[s.eff],
            s.eff==='stun'?'#f6e2b0':'#9ad4f0',14,'enemy');
        }
      }
      B.p.rage=Math.min(100,B.p.rage+12);
      if(target.hp<=0){
        target.dead=true;renderEnemies();
        const nx=B.enemies.findIndex(e=>!e.dead&&e.hp>0);
        if(nx>=0)B.target=nx;
      }
    }
    updateBars();
    setTimeout(()=>{
      if(B!==bt)return;
      if(checkWin())return;
      enemyTurn();
    },520);
  },260);
}
function showHit(i,r){
  const el=$('#enemies').children[i];
  if(!el)return;
  el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),340);
  floatText((r.crit?'暴击 ':'')+r.dmg,r.crit?'#ffd76a':'#ffe9d0',r.crit?26:19,'enemy');
  if(r.crit){
    const d=document.createElement('div');d.className='banner';d.style.top='24%';
    d.innerHTML='<div class="bt" style="font-size:20px;letter-spacing:6px;color:#ffd76a">暴　击</div>';
    $('#battle').appendChild(d);setTimeout(()=>d.remove(),700);
  }
}
function enemyTurn(){
  if(!B||B.over)return;
  const bt=B;
  const alive=B.enemies.filter(e=>!e.dead);
  if(!alive.length)return checkWin();
  let idx=0;
  const step=()=>{
    if(!B||B.over||B!==bt)return;
    const list=B.enemies.filter(e=>!e.dead&&e.hp>0);
    if(idx>=list.length){
      // 宠物与队友追击
      petAct(()=>allyAct(()=>{
        if(checkWin())return;
        B.busy=false;B.p.rage=Math.min(100,B.p.rage+8);
        updateBars();save();
        if(B.auto)autoTick();
      }));
      return;
    }
    const e=list[idx];idx++;
    tickBuffs(e,false);
    updateBars();
    if(e.hp<=0){e.dead=true;renderEnemies();return setTimeout(step,320)}
    if(e.buffs.stun){
      floatText('眩晕','#f6e2b0',14,'enemy');
      delete e.buffs.stun;
      return setTimeout(step,520);
    }
    const el=$('#enemies').children[B.enemies.indexOf(e)];
    if(el){el.classList.add('atk');setTimeout(()=>el.classList.remove('atk'),420)}
    setTimeout(()=>{
      if(B!==bt||B.over)return;
      const sk=pick(e.d.skills||[{n:'攻击',pw:1.2,t:'atk'}]);
      if(sk.t==='buff'){
        e.buffs.def={t:3,v:.5};
        floatText('妖气护体','#c9a4f0',13,'enemy');
      }else{
        const r=dealDamage({atk:e.atk,crit:e.crit},{...B.p,def:stats().def,buffs:B.p.buffs},sk.pw*(1+B.wave*.05));
        B.p.hp=Math.max(0,B.p.hp-r.dmg);
        const hero=$('#hero');
        if(hero){hero.classList.add('hit');setTimeout(()=>hero.classList.remove('hit'),340)}
        floatText('-'+r.dmg,'#ff9a94',19,'hero');
        if(sk.eff==='burn')B.p.buffs.burn={t:3,v:0};
        if(sk.eff==='poison')B.p.buffs.poison={t:3,v:0};
        if(sk.eff==='freeze')B.p.buffs.freeze={t:2,v:0};
      }
      updateBars();
      if(B.p.hp<=0)return loseBattle();
      setTimeout(step,480);
    },280);
  };
  setTimeout(step,300);
}
function petAct(cb){
  const p=activePet();
  if(!p){return cb()}
  const bt=B;
  const t=B.enemies.find(e=>!e.dead);
  if(!t)return cb();
  const el=$('#petSide');
  if(el){el.style.transform='translateX(18px)';setTimeout(()=>el.style.transform='',360)}
  setTimeout(()=>{
    if(B!==bt)return;
    const dmg=Math.round(p.lv*3.4*p.qual*(1+(p.skills.includes('蛮力')?.2:0)));
    t.hp=Math.max(0,t.hp-dmg);
    floatText(String(dmg),'#a8e6d0',15,'enemy');
    updateBars();
    cb();
  },300);
}
function allyAct(cb){
  const list=S.party||[];
  if(!list.length)return cb();
  let i=0;
  const step=()=>{
    if(!B||B.over||i>=list.length)return cb();
    const t=B.enemies.find(e=>!e.dead&&e.hp>0);
    if(!t)return cb();
    const el=$('#allies')&&$('#allies').children[i];
    if(el){el.classList.add('atk');setTimeout(()=>el.classList.remove('atk'),320)}
    const base=stats().atk*(0.18+Math.random()*0.1)+S.lv*1.2;
    const dmg=Math.max(3,Math.round(base*(1+(B.wave*.06))));
    t.hp=Math.max(0,t.hp-dmg);
    floatText(dmg,'#dfe6d6',13,'enemy');
    i++;updateBars();
    setTimeout(step,240);
  };
  step();
}
function returnFromBattle(){
  $('#battle').classList.add('hidden');
  B=null;GC=null;
  W.paused=false;
  save();renderHUD();
  if(W.sc){updateQuest();drawMini()}
}
function checkWin(){
  if(!B||B.over)return true;
  if(B.enemies.every(e=>e.dead||e.hp<=0)){
    B.busy=true;
    if(B.wave<B.cfg.waves.length-1){
      B.wave++;
      setTimeout(()=>{
        spawnWave();renderEnemies();updateBars();
        banner('第 '+(B.wave+1)+' 波');
        B.busy=false;
        if(B.auto)autoTick();
      },620);
      return true;
    }
    winBattle();
    return true;
  }
  return false;
}
function gainRewards(rw){
  if(!rw)return [];
  const out=[];
  if(rw.exp){addExp(rw.exp);out.push('修为 +'+rw.exp)}
  if(rw.gold){S.gold+=rw.gold;out.push('银两 +'+rw.gold)}
  if(rw.jade){S.jade+=rw.jade;out.push('仙玉 +'+rw.jade)}
  if(rw.items){for(const k in rw.items){addItem(k,rw.items[k]);out.push(ITEMS[k].n+' ×'+rw.items[k])}}
  return out;
}
function winBattle(){
  if(B.over)return;
  B.over=true;
  const cfg=B.cfg;
  const stw=stats();
  S.hp=Math.min(stw.hp,Math.max(1,B.p.hp)+Math.round(stw.hp*.22));
  S.mp=Math.min(stw.mp,B.p.mp+Math.round(stw.mp*.2));
  const rw=cfg.rw||{};
  const lines=gainRewards(rw);
  if(cfg.onWin)try{cfg.onWin()}catch(e){console.error(e)}
  save();renderHUD();
  const next=cfg.next||null;
  const box=document.createElement('div');
  box.className='result';
  box.innerHTML='<div class="box"><div style="font-size:9px;letter-spacing:5px;color:#c9a15c">VICTORY</div>'+
    '<h3>战斗胜利</h3><div class="line"></div>'+
    (lines.length?'<div class="rw">'+lines.map(l=>'<span>'+l+'</span>').join('')+'</div>':'<div class="mini">无掉落</div>')+
    '<div class="line"></div>'+
    '<button class="btn gold wide" id="resBtn">'+(next?'接着来':'回去')+'</button></div>';
  $('#battle').appendChild(box);
  box.querySelector('#resBtn').onclick=()=>{
    box.remove();
    if(next){$('#battle').classList.add('hidden');next()}
    else returnFromBattle();
  };
}
function loseBattle(){
  if(B.over)return;
  B.over=true;
  if(B.cfg.onLose)try{B.cfg.onLose()}catch(e){console.error(e)}
  S.hp=Math.max(1,Math.round(stats().hp*.3));
  save();renderHUD();
  const box=document.createElement('div');
  box.className='result';
  box.innerHTML='<div class="box"><div style="font-size:9px;letter-spacing:5px;color:#c9584c">DEFEAT</div>'+
    '<h3 style="color:#f0cfc0">力有不逮</h3><div class="line"></div>'+
    '<div class="mini">你被击退。醒来时，天已经黑了一半。\n回镇上歇一歇，或者再走一趟。</div><div class="line"></div>'+
    '<button class="btn wide" id="loseBtn">回去</button></div>';
  $('#battle').appendChild(box);
  box.querySelector('#loseBtn').onclick=()=>{box.remove();returnFromBattle()};
}
function autoTick(){
  if(!B||!B.auto||B.busy||B.over)return;
  setTimeout(()=>{
    if(!B||!B.auto||B.busy||B.over)return;
    const sk=SECTS[S.sect].skills;
    let best=-1;
    for(let i=sk.length-1;i>=0;i--){if(sk[i].t==='atk'&&B.p.mp>=sk[i].mp){best=i;break}}
    if(B.p.hp<stats().hp*.4&&S.sect==='yin'&&B.p.mp>=sk[1].mp)best=1;
    playerAct(best);
  },500);
}
function tryCatch(){
  if(!B||B.busy||B.over)return;
  const e=B.enemies[B.target];
  if(!e||e.dead)return toast('目标已倒下');
  if(!e.d.pet)return toast('此妖桀骜，无法结契');
  if(e.hp/e.maxHp>.35)return toast('需将气血压至 35% 以下');
  if(S.pets.length>=8)return toast('灵兽栏已满');
  B.busy=true;
  const chance=.55+ (1-e.hp/e.maxHp)*.4;
  if(Math.random()<chance){
    const p={mob:e.key||'wolf',name:e.d.n,lv:Math.max(1,e.lv-1),qual:+(rand(.95,1.9)).toFixed(2),skills:[],exp:0};
    S.pets.push(p);if(S.petOn<0)S.petOn=S.pets.length-1;
    S.counts.catch=(S.counts.catch||0)+1;
    mainEvent('catch',p.mob);
    B.over=true;
    save();renderHUD();
    const box=document.createElement('div');box.className='result';
    box.innerHTML='<div class="box"><div style="font-size:9px;letter-spacing:5px;color:#8fe0bd">CAPTURED</div>'+
      '<h3 style="font-size:23px">结契成功</h3><div class="line"></div>'+
      '<div style="font-size:13px;color:#f0e4cc">'+p.name+'　资质 '+p.qual.toFixed(2)+'</div>'+
      '<div class="mini" style="margin-top:8px">已收入灵兽栏，可出战助你</div><div class="line"></div>'+
      '<button class="btn jade wide" id="capBtn">查看灵兽</button></div>';
    $('#battle').appendChild(box);
    box.querySelector('#capBtn').onclick=()=>{box.remove();$('#battle').classList.add('hidden');B=null;W.paused=false;openSheet('pet')};
  }else{
    toast('捕捉失败，妖兽挣脱了');
    setTimeout(()=>{B.busy=false;enemyTurn()},400);
  }
}

/* ================= 各玩法入口 ================= */
function startWild(sceneId){
  const sc=sceneById(sceneId);
  const keys=[];
  (sc.mobs||[]).forEach(g=>keys.push(g.key));
  if(!keys.length)return toast('这地方没有野物');
  const key=pick(keys);
  const lv=Math.max(MOBS[key].lv,S.lv+ri(-1,1));
  startBattle({title:sc.n+' · 野外',sub:'遇到 '+MOBS[key].n,scene:sc.id,waves:[[{key,lv}]],
    rw:{exp:Math.round(40+lv*14),gold:Math.round(50+lv*16),
      items:Math.random()<.4?{forge:1}:{}},
    onWin:()=>{
      S.counts.kill=(S.counts.kill||0)+1;
      mainEvent('kill',key);
    }});
}
let GC=null;
function startGhost(){
  const m=MAIN[S.main.idx];
  const forQuest=!!(m&&m.k==='ghost'&&!S.main.ready);
  if(S.counts.ghost>=1&&!forQuest)return toast('今日已经走过一趟了。钟九的灯，夜里再点。');
  GC={i:0,max:10,exp:0,gold:0};
  ghostRound();
}
function ghostRound(){
  const i=GC.i,lv=S.lv+Math.floor(i*.7);
  const key=(i%4===3)?'ghostking':'ghost';
  startBattle({title:'夜巡 · '+(i+1)+'/10',sub:'钟九提灯 · '+MOBS[key].n,scene:'ruins',
    waves:[[{key,lv}]],
    rw:{exp:Math.round(50+lv*18),gold:Math.round(60+lv*22)},
    onWin:()=>{
      GC.i++;
      if(GC.i>=1)S.counts.ghost=Math.max(1,S.counts.ghost);
      if(GC.i>=GC.max){
        S.counts.ghost=(S.counts.ghost||0)+1;
        S.gold+=800;addItem('book',1);addItem('wash',1);
        toast('十轮走完 · 钟九把灯收了');
        mainEvent('ghost','ghost');
      }
    },
    next:()=>{
      if(GC.i>=GC.max){returnFromBattle();return}
      setTimeout(ghostRound,260);
    }});
}
function startGuild(){
  if(S.counts.guild>=3)return toast('今日的货走完了');
  const lv=S.lv+2;
  const key=pick(['ghost','stone','wolfred','sea']);
  startBattle({title:'帮派差事',sub:'为漕河帮压货 · '+MOBS[key].n,scene:S.scene,waves:[[{key,lv}]],
    rw:{exp:Math.round(80+lv*20),gold:Math.round(120+lv*26)},
    onWin:()=>{S.counts.guild=(S.counts.guild||0)+1;S.guild.contrib+=3;toast('货到了 · 贡献 +3')}});
}
function startDungeon(id){
  const d=DUNGEONS.find(x=>x.id===id);
  if(!d||S.lv<d.lv)return toast('境界不足');
  if((S.counts.dungeon||0)>=3)return toast('今日三道门都关了。守境人说：明日再来。');
  const first=!S.dun.clears[id];
  const waves=[
    [d.mobs[0],d.mobs[1]].map(k=>({key:k,lv:d.lv+1})),
    [d.boss,{key:d.mobs[0],lv:d.lv+2}],
    [{key:d.boss,lv:d.lv+5}]
  ];
  startBattle({title:'秘境 · '+d.n,sub:first?'这扇门第一次开':'门还认得你',scene:(SCENES.find(s=>s.art===d.art)||{id:'bamboo'}).id,
    waves,
    rw:{exp:d.rw.exp,gold:d.rw.gold,items:d.rw.items,jade:first?40:0},
    onWin:()=>{
      S.counts.dungeon=(S.counts.dungeon||0)+1;
      S.dun.clears[id]=1;
      if(first)toast('首通 · 仙玉 +40');
      mainEvent('dungeon',id);
    }});
}
function arenaDef(name,lv){
  const sec=SECTS[pick(Object.keys(SECTS))];
  const k=1+(lv-1)*.18;
  return {n:name,art:sec.art,lv,hp:Math.round(250*k),atk:Math.round(25*k),def:Math.round(12*k),spd:20,crit:.1,
    skills:[{n:'起手式',pw:1.35,t:'atk'},{n:'压箱底',pw:2.0,t:'atk'},{n:'调息',pw:0,t:'buff'}]};
}
function startArena(name,lv){
  if(S.counts.arena>=5)return toast('今日五场已经打完');
  const e=arenaDef(name,lv);
  startBattle({title:'擂台 · '+name,sub:'积分 '+S.arena.pts,scene:'town',waves:[[e]],
    rw:{exp:S.lv*22+80,gold:260,jade:8},
    onWin:()=>{
      S.counts.arena=(S.counts.arena||0)+1;S.arena.wins++;S.arena.pts+=24;
      mainEvent('arena','arena');toast('赢了 · 积分 +24');
    },
    onLose:()=>{
      S.counts.arena=(S.counts.arena||0)+1;S.arena.lose++;
      S.arena.pts=Math.max(800,S.arena.pts-12);
    }});
}

/* ================= 创角 ================= */
function showCreate(){
  let sel=S.sect||'jian';
  const c=$('#create');
  const build=()=>{
    c.innerHTML='<div class="ch"><div class="t">初出山门</div><div class="s">落 霞 镇 · 山 雨 欲 来</div>'+
      '<div style="font-size:10.5px;line-height:1.9;color:#a9b3ac;margin-top:10px;max-width:280px;margin-left:auto;margin-right:auto">镇子不大。山门在山上，日子在山下。<br>你袖里有一枚旧铜铃，铃口缺了一角。</div></div>'+
    '<div class="sectGrid">'+Object.keys(SECTS).map(k=>{
      const s=SECTS[k];
      return '<button class="sectCard '+(sel===k?'on':'')+'" data-s="'+k+'">'+
        '<div class="p" style="background-image:url('+s.art+')"></div>'+
        '<div class="info"><div class="nm">'+s.name+'</div><div class="ds">'+s.desc+'</div></div></button>'
    }).join('')+'</div>'+
    '<div class="cf"><button class="btn gold wide lg" id="startBtn">下 山</button></div>';
    c.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{sel=el.dataset.s;build()});
    c.querySelector('#startBtn').onclick=()=>{
      S.sect=sel;S.name=pick(['沈知白','陈岁','许照','林晚','周砚','赵迟']);
      const st=stats();S.hp=st.hp;S.mp=st.mp;save();
      c.classList.add('hidden');
      document.body.classList.remove('creating');
      buildPlayer();buildParty();renderHUD();renderWorld();
      toast('你从落霞镇走出来');
      setTimeout(()=>{
        modal('第一章 · 旧物','街尾有棵老槐树。树下坐着个下棋的老人。\n\n去和他说句话。',[{t:'过去',gold:1,fn:()=>{const n=sceneById('town').npcs.find(x=>x.id==='master');if(n)moveToPoint(n.x+24,n.y+26)}}]);
      },600);
    };
  };
  build();
  document.body.classList.add('creating');
  c.classList.remove('hidden');
}

/* ================= 初始化 ================= */
function preloadArt(){
  const urls=new Set(SCENES.map(s=>s.art));
  Object.keys(SECTS).forEach(k=>urls.add(SECTS[k].art));
  Object.keys(MOBS).forEach(k=>urls.add(MOBS[k].art));
  urls.forEach(u=>{const im=new Image();im.src=u});
}
function boot(){
  const fresh=!localStorage.getItem(KEY);
  S=load()||newGame();
  const st0=stats();
  if(!S.hp||S.hp>st0.hp)S.hp=st0.hp;
  if(!S.mp||S.mp>st0.mp)S.mp=st0.mp;
  if(!S.counts)S.counts={};
  if(!S.main)S.main={idx:0,prog:0,ready:false};
  if(S.main.ready==null)S.main.ready=false;
  if(!S.party)S.party=[{n:'谢临',sect:'jian'},{n:'阿箬',sect:'yin'}];
  if(S.pos==null)S.pos={x:500,y:1060};
  if(S.scene==='city')S.scene='town';
  if(S.scene==='sea')S.scene='ferry';
  if(!SECTS[S.sect])S.sect='jian';
  bindInput();
  setScene(S.scene,S.pos,true);
  initChat();
  weatherLoop();
  requestAnimationFrame(worldTick);
  $('#mountBtn').onclick=toggleMount;
  $('#chatBtn').onclick=()=>toggleChat();
  $('#chatTg').onclick=e=>{e.stopPropagation();toggleChat()};
  $('#chatTop').onclick=e=>{if(e.target.classList.contains('ch'))return;toggleChat()};
  $('#chatTop').querySelectorAll('.ch').forEach(el=>{
    el.onclick=ev=>{
      ev.stopPropagation();
      $('#chatTop').querySelectorAll('.ch').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      const t=el.textContent;
      chatFilter=t==='世界'?'world':t==='帮派'?'guild':'sys';
      renderChat();
      if(!chatOpen)toggleChat(true);
    };
  });
  $('#qGo').onclick=goQuest;
  $('#avatar').onclick=()=>openSheet('char');
  $('#mini').onclick=()=>openSheet('map');
  window.addEventListener('resize',()=>{
    if(!W.sc)return;
    setWeather(W.sc.weather||'fog');snapCamera();drawMini();
  });
  setInterval(()=>{
    if(B&&!B.over)return;
    const st=stats();
    if(S.hp<st.hp){S.hp=Math.min(st.hp,S.hp+st.hp*.012);renderHUD()}
    if(S.mp<st.mp){S.mp=Math.min(st.mp,S.mp+st.mp*.02);renderHUD()}
  },5000);
  setInterval(save,15000);
  setTimeout(preloadArt,300);
  if(fresh){
    setTimeout(showCreate,140);
  }else{
    const q=MAIN[S.main.idx];
    if(q)setTimeout(()=>{updateQuest();toast(q.hook,1)},900);
  }
}
window.addEventListener('DOMContentLoaded',boot);
</script>
