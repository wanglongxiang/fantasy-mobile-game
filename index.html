        <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#8a7a60"/><ellipse cx="${x - 6}" cy="${y - 6}" rx="${rx * .66}" ry="${ry * .62}" fill="#a89677" opacity=".85"/>`;
    });
    /* 海中礁石 */
    [[cx - 250, 700], [cx + 230, 820], [cx - 150, 1020], [cx + 300, 1120]].forEach(([x, y]) => {
      deco += `<ellipse cx="${x}" cy="${y}" rx="54" ry="26" fill="#3c5a5c"/><ellipse cx="${x - 8}" cy="${y - 10}" rx="36" ry="16" fill="#57787a"/>
        <path d="M${x - 40} ${y + 14} q40 14 80 0" stroke="#9fe0e2" stroke-width="3" fill="none" opacity=".6"/>`;
    });
    /* 木栈桥（右侧，避开出生点） */
    deco += `<g opacity=".96" style="pointer-events:none">
      <ellipse cx="${pierX}" cy="${shore + 84}" rx="96" ry="16" fill="#4a3a24" opacity=".35"/>
      <rect x="${pierX - 74}" y="${shore - 30}" width="148" height="112" fill="#8a6a44"/>
      <rect x="${pierX - 74}" y="${shore - 30}" width="148" height="112" fill="none" stroke="#4a3520" stroke-width="3"/>
      ${Array.from({ length: 6 }, (_, i) => `<path d="M${pierX - 74 + i * 30} ${shore - 30} v112" stroke="#5f4628" stroke-width="2.4"/>`).join('')}
      <rect x="${pierX - 86}" y="${shore - 38}" width="13" height="126" rx="4" fill="#4f3a22"/>
      <rect x="${pierX + 73}" y="${shore - 38}" width="13" height="126" rx="4" fill="#4f3a22"/>
      <path d="M${pierX - 80} ${shore - 34} v-58" stroke="#3a2a18" stroke-width="3"/>
      <ellipse cx="${pierX - 80}" cy="${shore - 96}" rx="9" ry="11" fill="#d8564c"/>
      <ellipse cx="${pierX - 80}" cy="${shore - 96}" rx="15" ry="17" fill="#ffb27a" opacity=".2"/>
      <path d="M${pierX + 96} ${shore + 96} q-8 -34 -40 -36 l0 18 q24 2 26 22 Z" fill="#7a5a34" stroke="#4a3520" stroke-width="2.5"/>
    </g>`;
    /* 沙滩小物 */
    deco += `<g opacity=".9" style="pointer-events:none">
      <ellipse cx="${cx + 88}" cy="${sc.spawn.y + 176}" rx="62" ry="17" fill="#9c8659" opacity=".4"/>
      <path d="M${cx + 30} ${sc.spawn.y + 168} q56 -26 116 -4 q-58 26 -116 4Z" fill="#8a6a44" stroke="#4a3520" stroke-width="2.5"/>
      <path d="M${cx + 40} ${sc.spawn.y + 169} q46 -18 96 -3" stroke="#c9a878" stroke-width="2.4" fill="none"/>
      <g fill="#f6e6c2" stroke="#b99a6a" stroke-width="1.2">
        <path d="M${cx - 330} ${sc.spawn.y + 220} q10 -12 20 0 q-10 10 -20 0Z"/>
        <path d="M${cx + 292} ${sc.spawn.y + 44} q9 -11 18 0 q-9 9 -18 0Z"/>
      </g>
      <g stroke="#d8895f" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M${cx - 300} ${sc.spawn.y + 320} l0 -10 M${cx - 300} ${sc.spawn.y + 310} l8 -6 M${cx - 300} ${sc.spawn.y + 310} l-8 -6 M${cx - 300} ${sc.spawn.y + 310} l0 8"/>
      </g>
    </g>`;
  }

  const pathD = sc.art === 'town'
    ? `M${cx} 180 L${cx} ${sc.h - 120} M180 ${sc.spawn.y} L${sc.w - 180} ${sc.spawn.y}`
    : sc.art === 'coast'
      ? `M${cx} ${sc.h - 80} Q${cx + 70} ${sc.h * .84} ${cx + 8} 1420`
      : `M${cx} ${sc.h - 70} Q${cx + 120} ${sc.h * .56} ${cx - 70} 220`;
  const bg = sc.art === 'town'
    ? `<rect width="100%" height="100%" fill="${pal.g1}"/>
       <rect width="100%" height="100%" fill="url(#wtex-${sc.id})" opacity=".1"/>
       <ellipse cx="${cx}" cy="${sc.h * .55}" rx="${sc.w * .62}" ry="${sc.h * .45}" fill="#e2c98c" opacity=".05"/>`
    : `<rect width="100%" height="100%" fill="${pal.g1}"/>
       <rect width="100%" height="100%" fill="url(#wtex-${sc.id})" opacity="${sc.art === 'coast' ? .1 : .26}"/>`;

  return `<svg width="${sc.w}" height="${sc.h}" viewBox="0 0 ${sc.w} ${sc.h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wbg-${sc.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${pal.g2}"/><stop offset=".45" stop-color="${pal.g1}"/><stop offset="1" stop-color="${pal.g2}"/>
      </linearGradient>
      <pattern id="wtex-${sc.id}" width="128" height="128" patternUnits="userSpaceOnUse">
        <image href="assets/scene/tile_stone1.png" width="128" height="128"/>
      </pattern>
      <pattern id="roofTex-${sc.id}" width="128" height="128" patternUnits="userSpaceOnUse">
        <image href="assets/scene/roof.png" width="128" height="128"/>
      </pattern>
      <linearGradient id="roofg-${sc.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7aa87e"/><stop offset=".55" stop-color="#4e7a5e"/><stop offset="1" stop-color="#31543f"/>
      </linearGradient>
      <radialGradient id="wvig-${sc.id}" cx="50%" cy="46%" r="66%">
        <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
      </radialGradient>
      <radialGradient id="glow-${sc.id}" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8effd8" stop-opacity=".85"/><stop offset="1" stop-color="#8effd8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#wbg-${sc.id})"/>
    ${bg}
    ${extra}
    <path d="${pathD}" stroke="#20180f" stroke-width="96" fill="none" opacity=".16" stroke-linecap="round"/>
    <path d="${pathD}" stroke="${pal.path}" stroke-width="76" fill="none" opacity=".46" stroke-linecap="round"/>
    <path d="${pathD}" stroke="${pal.edge}" stroke-width="66" fill="none" opacity=".28" stroke-dasharray="24 20" stroke-linecap="round"/>
    ${deco}
    <ellipse cx="${cx}" cy="${sc.spawn.y}" rx="330" ry="150" fill="#fff" opacity=".045" style="pointer-events:none"/>
    <rect width="100%" height="100%" fill="url(#wvig-${sc.id})"/>
  </svg>`;
}

function worldEntities(sc) {
  const npcs = sc.npcs.map((n, i) => `<button class="w-entity w-npc" style="left:${n.x}px;top:${n.y}px" data-act="worldNpc" data-arg="${i}">
    ${n.obj ? `<span class="spr obj">${icon(n.obj === 'quest' ? 'scroll' : 'shop')}</span>` : `<img class="spr" src="${npcSprite(n)}" alt="">`}
    <span class="nm">${n.name}</span>
    ${(n.act === 'master' || n.act === 'quest' || n.talk) ? '<i class="mark">!</i>' : ''}
  </button>`).join('');
  const mons = (sc.monsters || []).map((m, i) => `<button class="w-entity w-mon" style="left:${m.x}px;top:${m.y}px" data-act="worldMon" data-arg="${i}">
    <span class="spr mon">${monArt(m.sp)}</span><span class="nm">${SPECIES[m.sp].name} · Lv.${m.lv}${m.boss ? ' · 首领' : ''}</span>
    ${m.boss ? '<i class="mark">★</i>' : ''}</button>`).join('');
  const chests = (sc.chests || []).filter(c => !(S.player.chests || []).includes(c.id)).map(c => `<button class="w-entity w-chest" style="left:${c.x}px;top:${c.y}px" data-act="worldChest" data-arg="${c.id}">
    <span class="spr chest">${icon('chest')}</span><span class="nm">宝箱</span></button>`).join('');
  const portals = sc.portals.map((p, i) => `<button class="w-entity w-portal" style="left:${p.x}px;top:${p.y}px" data-act="worldPortal" data-arg="${i}">
    <span class="spr portal">${icon('portal')}</span><span class="nm">${p.label}</span></button>`).join('');
  return npcs + mons + chests + portals;
}

function ensureWorldPos(sc) {
  if (!S.player.worldScene || S.player.worldScene !== sc.id || S.player.px == null) {
    S.player.worldScene = sc.id; S.player.px = sc.spawn.x; S.player.py = sc.spawn.y;
  }
  S.player.scene = sc.id;
}

function enterWorld(scene) {
  if (B) return;
  const sc = SCENES[scene] || SCENES.town;
  S.tab = 'world';
  ensureWorldPos(sc);
  if (sc.id !== 'town') S.player.map = sc.id;
  closeSheet();
  save();
  render();
}

function renderWorld() {
  const sc = SCENES[S.player.scene] || SCENES.town;
  ensureWorldPos(sc);
  const mi = mainQuestInfo();
  document.getElementById('screen').innerHTML = `<div class="world" id="world">
    <div class="world-art" id="worldArt">${worldArt(sc)}${worldEntities(sc)}</div>
    <div class="w-fade" id="wFade"></div>
    <div class="hero-lock" id="heroLock">
      <span class="h-shadow"></span><img class="h-spr" src="${playerSprite()}" alt=""><span class="h-nm">${S.player.name || '少侠'}</span>
    </div>
    <div class="world-top">
      <div class="world-top-row">
        <div class="w-scene"><b>${sc.name}</b><span>${sc.sub}</span></div>
        <div class="w-quest"><div class="qt"><b>${mi ? mi.q.name : '江湖已定'}${mi ? `<i style="font-style:normal;font-size:10px;color:#8fa093;margin-left:4px">${mi.cur}/${mi.q.need}</i>` : ''}</b><span>${mi ? mi.q.desc : '主线已完成，可继续历练'}</span></div>${mi ? (mi.done ? '<button data-act="claimMain">领奖</button>' : '<button data-act="walkQuest">带路</button>') : ''}</div>
      </div>
    </div>
    <button class="joy" id="joy"><span class="knob"></span><span class="joy-hint">行走</span></button>
  </div>`;
  bindWorld();
}

function bindWorld() {
  const world = document.getElementById('world');
  const sc = SCENES[S.player.scene] || SCENES.town;
  const px = S.player.px == null ? sc.spawn.x : S.player.px;
  const py = S.player.py == null ? sc.spawn.y : S.player.py;
  W = { sc, x: px, y: py, joy: { active: false, dx: 0, dy: 0 }, target: null, pending: null,
    last: performance.now(), moving: false, near: null, nearSince: 0, raf: 0,
    lastBattle: Date.now(), lastSave: Date.now(), suppressN: new Set(), suppressM: new Set() };
  if (worldGuard) {
    sc.npcs.forEach((n, i) => { if (Math.hypot(n.x - px, n.y - py) < 150) W.suppressN.add(i); });
    (sc.monsters || []).forEach((m, i) => { if (Math.hypot(m.x - px, m.y - py) < 140) W.suppressM.add(i); });
    worldGuard = false;
  }
  updateCamera();
  world.addEventListener('click', e => {
    if (!W) return;
    if (e.target.closest('.w-entity') || e.target.closest('.joy') || e.target.closest('.world-top')) return;
    const r = document.getElementById('screen').getBoundingClientRect();
    W.target = { x: W.x + (e.clientX - r.left - r.width / 2), y: W.y + (e.clientY - r.top - r.height / 2) };
    W.pending = null;
  });
  const joy = document.getElementById('joy');
  let pid = null;
  const drag = e => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const max = r.width / 2 - 22, d = Math.hypot(dx, dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    const knob = joy.querySelector('.knob');
    if (knob) knob.style.transform = `translate(${dx}px, ${dy}px)`;
    W.joy.dx = dx / max; W.joy.dy = dy / max; W.joy.active = Math.hypot(dx, dy) > 7;
    if (W.joy.active) W.target = null;
    e.preventDefault();
  };
  joy.addEventListener('pointerdown', e => { pid = e.pointerId; try { joy.setPointerCapture(pid); } catch (err) { } drag(e); });
  joy.addEventListener('pointermove', e => { if (pid === e.pointerId) drag(e); });
  const end = e => {
    if (pid !== e.pointerId) return;
    pid = null; W.joy.active = false; W.joy.dx = W.joy.dy = 0;
    const knob = joy.querySelector('.knob'); if (knob) knob.style.transform = 'translate(0,0)';
  };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  cancelAnimationFrame(W.raf);
  W.raf = requestAnimationFrame(worldLoop);
}

function updateCamera() {
  if (!W) return;
  const el = document.getElementById('worldArt'), screenEl = document.getElementById('screen');
  if (!el || !screenEl) return;
  const r = screenEl.getBoundingClientRect();
  el.style.transform = `translate3d(${Math.round(r.width / 2 - W.x)}px, ${Math.round(r.height / 2 - W.y)}px, 0)`;
}

function worldLoop(t) {
  if (!W || S.tab !== 'world') return;
  const dt = Math.min((t - W.last) / 1000, .05); W.last = t;
  if (B) { W.raf = requestAnimationFrame(worldLoop); return; }
  const ov = document.getElementById('overlay');
  if (ov && !ov.classList.contains('hidden')) { W.raf = requestAnimationFrame(worldLoop); return; }
  let dx = 0, dy = 0;
  if (W.joy.active) { dx = W.joy.dx; dy = W.joy.dy; }
  else if (W.target) {
    const tx = W.target.x - W.x, ty = W.target.y - W.y, d = Math.hypot(tx, ty);
    if (d < 12) { W.target = null; onWorldArrive(); }
    else { dx = tx / d; dy = ty / d; }
  }
  if (dx || dy) {
    const len = Math.hypot(dx, dy) || 1;
    W.x += dx / len * 240 * dt; W.y += dy / len * 240 * dt; W.moving = true;
    S.player.px = W.x; S.player.py = W.y;
  } else W.moving = false;
  W.x = clamp(W.x, 60, W.sc.w - 60); W.y = clamp(W.y, 90, W.sc.h - 60);
  updateCamera();
  const hero = document.getElementById('heroLock');
  if (hero) {
    hero.classList.toggle('walk', W.moving);
    const av = hero.querySelector('.h-spr');
    if (av && Math.abs(dx) > .1) av.style.setProperty('--flip', dx < 0 ? -1 : 1);
  }
  checkWorldNear(t);
  if (!W) return;
  if (Date.now() - W.lastSave > 1500) { W.lastSave = Date.now(); save(); }
  W.raf = requestAnimationFrame(worldLoop);
}

function onWorldArrive() {
  const p = W && W.pending; if (!p) return;
  W.pending = null;
  if (p.type === 'npc') openWorldNpc(p.idx);
  else if (p.type === 'monster') { if (W) W.suppressM.add(p.idx); beginWorldBattle(); }
  else if (p.type === 'portal') switchScene(SCENES[S.player.scene].portals[p.idx].to, p.quest);
  else if (p.type === 'chest') claimChest(p.id);
}

function checkWorldNear(t) {
  if (!W) return;
  const sc = W.sc;
  let near = null, bd = 1e9;
  sc.npcs.forEach((n, i) => {
    const d = Math.hypot(n.x - W.x, n.y - W.y);
    if (d > 165) W.suppressN.delete(i);
    if (d < 115 && d < bd) { bd = d; near = { type: 'npc', idx: i, label: '交谈 · ' + n.name }; }
  });
  sc.portals.forEach((p, i) => { const d = Math.hypot(p.x - W.x, p.y - W.y); if (d < 100 && d < bd) { bd = d; near = { type: 'portal', idx: i, label: '前往 · ' + p.label.replace('山门 · ', '') }; } });
  (sc.chests || []).forEach(c => { if ((S.player.chests || []).includes(c.id)) return; const d = Math.hypot(c.x - W.x, c.y - W.y); if (d < 75 && d < bd) { bd = d; near = { type: 'chest', id: c.id, label: '开启宝箱' }; } });
  (sc.monsters || []).forEach((m, i) => {
    const d = Math.hypot(m.x - W.x, m.y - W.y);
    if (d > 165) W.suppressM.delete(i);
    if (d < 100 && d < bd) { bd = d; near = { type: 'monster', idx: i, label: '挑战 · ' + SPECIES[m.sp].name }; }
  });
  if (near && near.type === 'monster' && bd < 40 && !W.suppressM.has(near.idx) && Date.now() - W.lastBattle > 2500) {
    W.suppressM.add(near.idx); beginWorldBattle(sc.monsters[near.idx]); return;
  }
  if (near && near.type === 'chest' && bd < 42) { claimChest(near.id); return; }
  if (!near) { W.near = null; W.nearSince = 0; showWorldAct(null); return; }
  if (!W.near || W.near.label !== near.label) { W.near = near; W.nearSince = t; }
  showWorldAct(near);
  if (!W.moving && near.type === 'npc' && !W.suppressN.has(near.idx) && t - W.nearSince > 700) {
    W.nearSince = t + 1e6; W.suppressN.add(near.idx); openWorldNpc(near.idx);
  }
}

function showWorldAct(near) {
  const world = document.getElementById('world');
  if (!world) return;
  let btn = document.getElementById('wAct');
  if (!near) { if (btn) btn.remove(); return; }
  if (!btn) { btn = document.createElement('button'); btn.id = 'wAct'; btn.className = 'w-act'; btn.dataset.act = 'worldAct'; world.appendChild(btn); }
  if (btn.textContent !== near.label) btn.textContent = near.label;
}

function openWorldNpc(i) {
  const n = SCENES[S.player.scene].npcs[i];
  if (!n) return;
  if (W) W.suppressN.add(i);
  S.player.daily.talks = (S.player.daily.talks || 0) + 1;
  save();
  if (n.talk) return openTalk(n.talk);
  if (n.act === 'shop') return go('shop');
  if (n.act === 'pets') return go('pets');
  if (n.act === 'quest') return go('quest');
  if (n.act === 'master') return ACT.master();
  if (n.act === 'rest') return ACT.rest();
}

let talkState = null;
function openTalk(key) {
  const t = TALKS[key];
  if (!t) return;
  S.player.talks = S.player.talks || {};
  const seen = (S.player.talks[key] = (S.player.talks[key] || 0) + 1);
  const lines = (seen > 1 && t.repeat && t.repeat.length) ? t.repeat : t.lines;
  talkState = { key, lineIdx: 0, lines: lines.slice(), action: t.act };
  renderTalk();
}
function renderTalk() {
  if (!talkState) return;
  const t = TALKS[talkState.key];
  const line = talkState.lines[talkState.lineIdx];
  const last = talkState.lineIdx >= talkState.lines.length - 1;
  openSheet(`
    <div class="talk">
      <div class="talk-portrait"><img src="assets/chars/${t.sprite}.png" alt=""><span class="talk-lv">江湖人</span></div>
      <div class="talk-body">
        <div class="talk-name">${t.name}</div>
        <div class="talk-text">${line}</div>
        <div class="talk-dots">${talkState.lines.map((_, i) => `<i class="${i <= talkState.lineIdx ? 'on' : ''}"></i>`).join('')}</div>
        <div class="sheet-actions">
          ${last && talkState.action ? `<button class="btn gold" data-act="talkAction">${talkState.action.label}</button>` : ''}
          ${last ? `<button class="btn ghost" data-act="closeSheet">告辞</button>` : `<button class="btn gold" data-act="talkNext">继续</button>`}
        </div>
      </div>
    </div>`, true);
}

function beginWorldBattle(m) {
  if (B) return;
  worldGuard = true;
  lastWorldScene = S.player.scene;
  if (W) { W.target = null; W.pending = null; cancelAnimationFrame(W.raf); }
  window._enc = m || null;
  startBattle(m && m.boss ? 'boss' : 'wild');
}

function switchScene(to, quest) {
  if (!W) return;
  const fade = document.getElementById('wFade');
  if (fade) fade.classList.add('on');
  setTimeout(() => {
    if (to === '__map') to = S.player.map || 'zhulin';
    const sc = SCENES[to] || SCENES.town;
    S.player.scene = to; S.player.worldScene = to;
    S.player.px = sc.spawn.x; S.player.py = sc.spawn.y;
    if (to !== 'town') S.player.map = to;
    save();
    W = null;
    render();
    if (quest) setTimeout(walkQuest, 420);
  }, 220);
}

function openPortal(p) {
  if (!p) return;
  if (p.to === '__travel') return openTravelSheet();
  switchScene(p.to);
}

function openTravelSheet() {
  const p = S.player;
  openSheet(`
    <h3>山门 · 远行</h3>
    <div class="sub">择一处秘境，踏风而行</div>
    ${Object.values(MAPS).map(m => {
      const lock = p.level < m.unlock;
      return `<button class="row" data-act="travelTo" data-arg="${m.id}" style="width:100%;text-align:left;${lock ? 'opacity:.5' : ''}">
        <div class="r-ico">${m.icon}</div>
        <div class="r-main"><div class="r-name">${m.name} ${lock ? `<span class="tag off">Lv.${m.unlock} 解锁</span>` : `<span class="tag">Lv.${m.lv}</span>`}</div>
        <div class="r-desc">${m.sub}</div></div>
        <div class="r-right" style="color:#e6c384">${lock ? icon('shield') : icon('arrow')}</div>
      </button>`;
    }).join('')}
    <div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">留在城中</button></div>`, true);
}

function claimChest(id) {
  if (!W) return;
  const sc = SCENES[S.player.scene];
  const c = (sc.chests || []).find(x => x.id === id);
  if (!c) return;
  S.player.chests = S.player.chests || [];
  if (S.player.chests.includes(id)) return;
  S.player.chests.push(id);
  S.player.daily.chests = (S.player.daily.chests || 0) + 1;
  save();
  const btn = [...document.querySelectorAll('.w-chest')].find(el => el.dataset.arg === id);
  if (btn) { btn.style.transition = 'transform .2s, opacity .2s'; btn.style.transform = 'translate(-50%,-70%) scale(.2)'; btn.style.opacity = '0'; setTimeout(() => btn.remove(), 220); }
  W.near = null; showWorldAct(null);
  grant(c.reward);
}

function walkQuest() {
  if (!W) return;
  const mi = mainQuestInfo();
  if (!mi) return toast('主线已完成，可自由历练');
  const key = mi.q.key;
  const matches = m => key === '__capture' ? SPECIES[m.sp].pet : m.sp === key;
  const dest = Object.keys(SCENES).find(id => (SCENES[id].monsters || []).some(matches));
  if (!dest) return toast('暂时找不到目标', 'bad');
  if (S.player.scene !== dest) {
    toast('前往 · ' + SCENES[dest].name);
    switchScene(dest, true);
    return;
  }
  const sc = SCENES[dest];
  const idx = sc.monsters.findIndex(matches);
  const m = sc.monsters[idx];
  W.target = { x: m.x, y: m.y + 22 };
  W.pending = { type: 'monster', idx };
  toast('前往目标 · ' + SPECIES[m.sp].name);
}

/* ===================== 存档 ===================== */
const SAVE_KEY = 'huantang_xianyuan_v1';
let S = null;

function defaultState() {
  return {
    ver: 1, created: false,
    player: {
      name: '', sect: 'tiance', gender: 'm', level: 1, exp: 0, hp: 0, mp: 0, gold: 120,
      equip: { weapon: null, armor: null, trinket: null },
      kills: {}, captures: 0, questIdx: 0, map: 'zhulin', wins: 0,
      daily: { date: todayKey(), battles: 0, captures: 0, kills: 0, chests: 0, talks: 0, claimed: [], actChests: [] }
    },
    bag: { hp1: 5, mp1: 2 },
    pets: [], activePet: null,
    tab: 'town'
  };
}

function loadSave() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) { S = defaultState(); return; }
  try {
    const d = JSON.parse(raw);
    S = Object.assign(defaultState(), d);
    S.player = Object.assign(defaultState().player, d.player || {});
    S.player.equip = Object.assign({ weapon: null, armor: null, trinket: null }, (d.player && d.player.equip) || {});
    S.player.daily = Object.assign({ date: todayKey(), battles: 0, captures: 0, kills: 0, chests: 0, talks: 0, claimed: [], actChests: [] }, (d.player && d.player.daily) || {});
    S.bag = d.bag || {}; S.pets = d.pets || []; S.activePet = d.activePet ?? null;
    checkDailyReset();
  } catch (e) { S = defaultState(); }
}

let saveTimer = null;
function save(now) {
  if (!S || !S.created) return;
  const doIt = () => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
    saveTimer = null;
  };
  if (now) { clearTimeout(saveTimer); doIt(); }
  else { clearTimeout(saveTimer); saveTimer = setTimeout(doIt, 400); }
}

function checkDailyReset() {
  const d = S.player.daily;
  if (d.date !== todayKey()) {
    S.player.daily = { date: todayKey(), battles: 0, captures: 0, kills: 0, chests: 0, talks: 0, claimed: [], actChests: [] };
  }
}
function dailyAct() {
  const dl = S.player.daily;
  return DAILIES.filter(d => dl.claimed.includes(d.id)).reduce((n, d) => n + (d.act || 0), 0);
}

/* ===================== 数值 ===================== */
function playerStats() {
  const p = S.player, sct = SECTS[p.sect];
  const st = {};
  STAT_KEYS.forEach(k => st[k] = Math.round(sct.base[k] + sct.grow[k] * (p.level - 1)));
  Object.values(p.equip).forEach(id => {
    if (id && ITEMS[id] && ITEMS[id].stats) for (const k in ITEMS[id].stats) st[k] += ITEMS[id].stats[k];
  });
  return st;
}

function expNeed(lv) { return Math.round(50 * lv + 28 * lv * lv); }

const PET_SKILLS = {
  heal: { name: '回春术', type: 'heal', mult: 1.0 },
  poison: { name: '淬毒撕咬', type: 'phys', mult: 1.35, status: 'poison' },
  crit: { name: '破军击', type: 'phys', mult: 1.7 }
};
function petStats(pet) {
  const sp = SPECIES[pet.sp], st = {}, apt = pet.apt || 1;
  STAT_KEYS.forEach(k => st[k] = Math.round((sp.base[k] + sp.grow[k] * (pet.level - 1)) * apt));
  return st;
}

function petExpNeed(lv) { return Math.round(50 * lv + 35 * lv * lv); }

function makePet(spId, level) {
  const sp = SPECIES[spId];
  const roll = Math.random();
  const apt = roll < .45 ? { v: .92, label: '丙' } : roll < .8 ? { v: 1.0, label: '乙' } : roll < .96 ? { v: 1.1, label: '甲' } : { v: 1.2, label: '天' };
  const pet = {
    uid: 'p' + Date.now() + rnd(100, 999), sp: spId,
    name: sp.name, level: clamp(level, 1, 20), exp: 0, hp: 0,
    apt: apt.v, aptLabel: apt.label,
    books: [{ ...sp.skill }]
  };
  pet.hp = petStats(pet).hp;
  return pet;
}

function activePet() {
  if (S.activePet == null) return null;
  return S.pets.find(p => p.uid === S.activePet) || null;
}

function bagCount(id) { return S.bag[id] || 0; }

function addItem(id, n = 1) {
  S.bag[id] = (S.bag[id] || 0) + n;
  save();
}

function removeItem(id, n = 1) {
  if (!S.bag[id]) return false;
  S.bag[id] -= n;
  if (S.bag[id] <= 0) delete S.bag[id];
  save();
  return true;
}

/* 经验与升级 */
function addExp(n) {
  const p = S.player;
  p.exp += n;
  const gained = [];
  while (p.level < 20 && p.exp >= expNeed(p.level)) {
    p.exp -= expNeed(p.level);
    p.level++;
    const st = playerStats();
    p.hp = Math.min(st.hp, p.hp + Math.round(st.hp * 0.35));
    p.mp = Math.min(st.mp, p.mp + Math.round(st.mp * 0.35));
    gained.push(p.level);
  }
  if (p.level >= 20) p.exp = Math.min(p.exp, expNeed(20));
  save();
  return gained;
}

function addPetExp(pet, n) {
  pet.exp += n;
  let ups = 0;
  while (pet.level < 20 && pet.exp >= petExpNeed(pet.level)) {
    pet.exp -= petExpNeed(pet.level);
    pet.level++; ups++;
    pet.hp = petStats(pet).hp;
  }
  if (pet.level >= 20) pet.exp = Math.min(pet.exp, petExpNeed(20));
  return ups;
}

/* 存档初始化时补满气血法力 */
function ensureVitals() {
  const st = playerStats();
  if (!S.player.hp || S.player.hp > st.hp) S.player.hp = st.hp;
  if (!S.player.mp || S.player.mp > st.mp) S.player.mp = st.mp;
  (S.pets || []).forEach(pet => {
    const mx = petStats(pet).hp;
    if (typeof pet.hp !== 'number') pet.hp = mx;
    else pet.hp = clamp(pet.hp, 0, mx);
  });
}

/* ===================== 通用 UI ===================== */
const overlay = () => document.getElementById('overlay');

let toastQ = [], toastBusy = false;
function toast(msg, kind) {
  toastQ.push([msg, kind]);
  if (toastQ.length > 8) toastQ.shift();
  if (!toastBusy) nextToast();
}
function nextToast() {
  const box = document.getElementById('toasts');
  const item = toastQ.shift();
  if (!box || !item) { toastBusy = false; return; }
  toastBusy = true;
  box.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast' + (item[1] ? ' ' + item[1] : '');
  el.textContent = item[0];
  box.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-8px)';
    setTimeout(() => { el.remove(); nextToast(); }, 180);
  }, 1150);
}

let sheetLock = false;
function openSheet(html, center, lock) {
  const ov = overlay();
  ov.innerHTML = '<div class="sheet">' + html + '</div>';
  ov.classList.remove('hidden');
  ov.classList.toggle('center', !!center);
  sheetLock = !!lock;
}
function closeSheet() {
  const ov = overlay();
  ov.classList.add('hidden');
  ov.innerHTML = '';
  sheetLock = false;
}

let pendingConfirm = null;
function confirmBox(title, text, okText, fn) {
  pendingConfirm = fn;

    <div class="sub">${text}</div>
    <div class="sheet-actions">
      <button class="btn ghost" data-act="closeSheet">取消</button>

}

function go(tab) {
  if (tab === 'town') return enterWorld('town');
  if (tab === 'wild') return enterWorld(S.player.map || 'zhulin');
  if (tab === 'world') return enterWorld(S.player.scene || 'town');
  if (W) { cancelAnimationFrame(W.raf); W = null; }
  worldGuard = true;
  S.tab = tab; save();
  const sc = document.getElementById('screen');
  sc.scrollTop = 0;
  render();
  sc.classList.remove('fade-in');
  void sc.offsetWidth;
  sc.classList.add('fade-in');
}

/* ===================== 主城 ===================== */
function mainQuestInfo() {
  const q = MAIN_QUESTS[S.player.questIdx];
  if (!q) return null;
  const cur = q.key === '__capture' ? S.player.captures : (S.player.kills[q.key] || 0);
  return { q, cur: Math.min(cur, q.need), done: cur >= q.need };
}

function dailyProgress(d) {
  const dl = S.player.daily;
  return Math.min(dl[d.key] || 0, d.need);
}

function hasClaimable() {
  const mi = mainQuestInfo();
  if (mi && mi.done) return true;
  if (DAILIES.some(d => dailyProgress(d) >= d.need && !S.player.daily.claimed.includes(d.id))) return true;
  const act = dailyAct(), claimed = S.player.daily.actChests || [];
  return ACT_CHESTS.some((c, i) => act >= c.at && !claimed.includes(i));
}

function screenBag() {
  const ids = Object.keys(S.bag).filter(id => S.bag[id] > 0 && ITEMS[id]);
  const potions = ids.filter(id => ITEMS[id].type !== 'equip');
  const equips = ids.filter(id => ITEMS[id].type === 'equip');
  const row = id => {
    const it = ITEMS[id], q = it.q ? qOf(id) : null;
    let action = '';
    if (it.type === 'potion') action = `<button class="btn sm" data-act="useItem" data-arg="${id}">使用</button>`;
    else if (it.type === 'equip') action = `<button class="btn sm" data-act="equipItem" data-arg="${id}">装备</button>`;
    else if (it.type === 'book') action = `<span class="tag">宠物打书</span>`;
    else action = `<span class="tag">战斗中用</span>`;
    return `<div class="row" ${q ? qStyle(id) : ''}>
      <div class="r-ico">${icon(itemIcon(id))}</div>
      <div class="r-main"><div class="r-name">${it.name} ${q ? `<span style="color:${q.c};font-size:10px;border:1px solid ${q.c}66;padding:0 4px;border-radius:4px">${q.name}</span>` : ''} <span style="color:#8fa093;font-size:10px">×${S.bag[id]}</span></div>

  const p = S.player, mi = mainQuestInfo(), dl = p.daily;

    if (i > p.questIdx) return '';
    const cur = q.key === '__capture' ? p.captures : (p.kills[q.key] || 0);
    return `<div class="row" style="border-color:rgba(217,176,106,.4)">
      <div class="r-ico">${icon('scroll')}</div>

        <div class="r-desc">${q.desc}</div>
        <div class="pbar"><i style="width:${Math.min(cur / q.need, 1) * 100}%"></i></div>
      </div>
      <div class="r-right">
        <div style="font-size:9px;color:#8fa093;margin-bottom:5px">${Math.min(cur, q.need)}/${q.need}</div>
        <button class="btn sm ${cur >= q.need ? 'gold' : 'ghost'}" data-act="claimMain" ${cur >= q.need ? '' : 'disabled'}>领取</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pagebar"><span class="ptitle">任务</span><button class="btn sm ghost" data-act="go" data-arg="world" style="margin-left:auto">${icon('map')} 回世界</button></div>
    <div class="sec-title" style="margin-top:6px">主线 · 江湖行<small>第 ${Math.min(p.questIdx + 1, MAIN_QUESTS.length)} 章 / 共 ${MAIN_QUESTS.length} 章</small></div>
    ${mainList || '<div class="empty">主线已全部完成</div>'}

    <div class="act-card">
      <div class="act-head"><b>活跃度 ${dailyAct()}</b><span>/ 100</span></div>
      <div class="pbar" style="height:9px"><i style="width:${Math.min(100, dailyAct())}%"></i></div>
      <div class="act-chests">
        ${ACT_CHESTS.map((c, i) => {
          const claimed = (dl.actChests || []).includes(i);
          const ok = dailyAct() >= c.at && !claimed;
          return `<button class="act-chest ${ok ? 'ok' : ''} ${claimed ? 'done' : ''}" data-act="claimActChest" data-arg="${i}" ${ok ? '' : 'disabled'}>
            <span>${icon('chest')}</span><b>${claimed ? '已领' : c.at}</b></button>`;
        }).join('')}
      </div>
    </div>
    ${DAILIES.map(d => {
      const cur = dailyProgress(d), done = cur >= d.need, claimed = dl.claimed.includes(d.id);
      const rw = [];
      if (d.rw.gold) rw.push(`银两 ${d.rw.gold}`);
      if (d.rw.exp) rw.push(`修为 ${d.rw.exp}`);
      if (d.rw.items) for (const k in d.rw.items) rw.push(`${ITEMS[k].name}×${d.rw.items[k]}`);
      return `<div class="row">
        <div class="r-ico" style="font-size:0">${icon(claimed ? 'star' : 'clock')}</div>
        <div class="r-main"><div class="r-name">${d.name} <span class="tag">活跃 +${d.act}</span></div>

        <div class="pbar"><i style="width:${cur / d.need * 100}%"></i></div></div>
        <div class="r-right"><div style="font-size:10px;color:#8fa093;margin-bottom:5px">${cur}/${d.need}</div>
        <button class="btn sm ${done && !claimed ? 'gold' : 'ghost'}" data-act="claimDaily" data-arg="${d.id}" ${done && !claimed ? '' : 'disabled'}>${claimed ? '已领' : '领取'}</button></div>
      </div>`;
    }).join('')}

}

/* ===================== 路由 ===================== */
function render() {
  if (!S || !S.created) return;
  ensureVitals();
  renderTop();
  renderTabbar();
  const sc = document.getElementById('screen');
  const cur = sc.scrollTop;
  const isWorld = S.tab === 'world';
  sc.classList.toggle('world-screen', isWorld);
  if (isWorld) renderWorld();
  else if (S.tab === 'hero') sc.innerHTML = screenHero();
  else if (S.tab === 'bag') sc.innerHTML = screenBag();
  else if (S.tab === 'quest') sc.innerHTML = screenQuest();
  else if (S.tab === 'pets') sc.innerHTML = screenPets();
  else if (S.tab === 'shop') sc.innerHTML = screenShop();
  else if (S.tab === 'settings') sc.innerHTML = screenSettings();
  sc.scrollTop = cur;
}

/* ===================== 奖励 ===================== */
function grant(rw) {
  const p = S.player;
  if (rw.gold) { p.gold += rw.gold; }
  if (rw.items) for (const id in rw.items) S.bag[id] = (S.bag[id] || 0) + rw.items[id];
  let ups = [];
  if (rw.exp) ups = addExp(rw.exp);
  save();
  const parts = [];
  if (rw.gold) parts.push(`🪙${rw.gold}`);
  if (rw.exp) parts.push(`✨${rw.exp}`);
  if (rw.items) for (const id in rw.items) parts.push(`${ITEMS[id].icon}${ITEMS[id].name}×${rw.items[id]}`);
  toast('获得 ' + parts.join(' '), 'good');
  if (ups.length) {
    renderTop();
    setTimeout(() => toast(`境界提升！已是 Lv.${p.level}`, 'good'), 350);
  }
}

/* ===================== 交互动作 ===================== */
const ACT = {
  go: t => go(t),
  closeSheet: () => closeSheet(),
  doConfirm: () => { const fn = pendingConfirm; pendingConfirm = null; closeSheet(); if (fn) fn(); },

  rest: () => {
    const st = playerStats();
    S.player.hp = st.hp; S.player.mp = st.mp;
    if (S.pets.length) S.pets.forEach(p => p.hp = petStats(p).hp);
    save(); render();
    toast('客栈一梦，气血法力尽复', 'good');
  },

  pickMap: id => {
    if (S.player.level < MAPS[id].unlock) return toast(`需达到 Lv.${MAPS[id].unlock} 才能进入`, 'bad');
    S.player.map = id; save(); render();
  },

  worldNpc: i => {
    if (!W) return;
    const n = SCENES[S.player.scene].npcs[i];
    if (!n) return;
    if (Math.hypot(n.x - W.x, n.y - W.y) > 110) {
      W.target = { x: n.x, y: n.y + 45 }; W.pending = { type: 'npc', idx: i };
    } else openWorldNpc(i);
  },

  worldMon: i => {
    if (!W) return;
    const m = SCENES[S.player.scene].monsters[i];
    if (!m) return;
    if (Math.hypot(m.x - W.x, m.y - W.y) > 100) {
      W.target = { x: m.x, y: m.y + 30 }; W.pending = { type: 'monster', idx: i };
    } else { W.suppressM.add(i); beginWorldBattle(m); }
  },

  worldChest: id => {
    if (!W) return;
    const c = (SCENES[S.player.scene].chests || []).find(x => x.id === id);
    if (!c) return;
    if (Math.hypot(c.x - W.x, c.y - W.y) > 70) {
      W.target = { x: c.x, y: c.y + 16 }; W.pending = { type: 'chest', id };
    } else claimChest(id);
  },

  worldPortal: i => {
    if (!W) return;
    const sc = SCENES[S.player.scene], p = sc.portals[i];
    if (!p) return;
    if (Math.hypot(p.x - W.x, p.y - W.y) > 90) {
      W.target = { x: p.x, y: p.y + 30 }; W.pending = { type: 'portal', idx: i };
    } else openPortal(p);
  },

  worldAct: () => {
    if (!W || !W.near) return;
    const n = W.near;
    if (n.type === 'npc') openWorldNpc(n.idx);
    else if (n.type === 'monster') { W.suppressM.add(n.idx); beginWorldBattle(SCENES[S.player.scene].monsters[n.idx]); }
    else if (n.type === 'chest') claimChest(n.id);
    else if (n.type === 'portal') { const p = SCENES[S.player.scene].portals[n.idx]; if (p) openPortal(p); }
  },

  talkNext: () => { if (talkState && talkState.lineIdx < talkState.lines.length - 1) { talkState.lineIdx++; renderTalk(); } },
  talkAction: () => {
    if (!talkState || !talkState.action) return;
    const a = talkState.action;
    talkState = null;
    closeSheet();
    if (a.act === 'shop') go('shop');
    else if (a.act === 'pets') go('pets');
    else if (a.act === 'quest') go('quest');
    else if (a.act === 'rest') ACT.rest();
    else if (a.act === 'master') ACT.master();
  },
  travelTo: id => { closeSheet(); if (id === 'town') switchScene('town'); else switchScene(id); },
  openTravel: () => openTravelSheet(),

  walkQuest: () => walkQuest(),

  beastInfo: id => {
    const sp = SPECIES[id];
    openSheet(`
      <h3>${sp.name}</h3>
      <div class="sub">${sp.pet ? '可捕捉为召唤兽' : '首领 · 不可捕捉'}</div>
      <div class="stat-grid">
        ${STAT_KEYS.map(k => `<div class="stat"><span>${STAT_NAMES[k]}</span><b>${Math.round(sp.base[k])}</b></div>`).join('')}
      </div>
      <div style="margin-top:12px;font-size:11px;color:#a9b8ae;line-height:1.7">
        ${sp.pet ? `专属技能「${sp.skill.name}」：${sp.skillDesc}` : '此地首领，实力强横，击败可获得大量奖励。'}
      </div>
      <div class="sheet-actions"><button class="btn" data-act="closeSheet">知道了</button></div>`, true);
  },

  shop: () => go('shop'),

  buy: id => {
    const it = ITEMS[id], p = S.player;
    if (p.gold < it.price) return toast('银两不足', 'bad');
    if (it.type === 'equip' && p.level < it.lv) return toast(`需达到 Lv.${it.lv} 方可使用`, 'bad');
    p.gold -= it.price;
    addItem(id, 1);
    toast(`购得 ${it.name}`, 'good');
    render();
  },

  useItem: id => {
    const it = ITEMS[id], p = S.player, st = playerStats();
    if (bagCount(id) < 1) return;
    if (it.type === 'tool') return toast('捆仙索需在战斗捕捉时使用', 'bad');
    if (it.hp) { p.hp = Math.min(st.hp, p.hp + it.hp); }
    if (it.mp) { p.mp = Math.min(st.mp, p.mp + it.mp); }
    if (it.exp) { const ups = addExp(it.exp); if (ups.length) toast(`修为精进，已达 Lv.${p.level}`, 'good'); }
    removeItem(id, 1);
    toast(`服下 ${it.name}`, 'good');
    render(); save();
  },

  equipItem: id => {
    const it = ITEMS[id], p = S.player;
    if (p.level < it.lv) return toast(`需达到 Lv.${it.lv}`, 'bad');
    if (bagCount(id) < 1) return;
    const old = p.equip[it.slot];
    p.equip[it.slot] = id;
    removeItem(id, 1);
    if (old) addItem(old, 1);
    const st = playerStats();
    p.hp = Math.min(p.hp, st.hp); p.mp = Math.min(p.mp, st.mp);
    save(); render();
    toast(`已装备 ${it.name}`, 'good');
  },

  unequip: slot => {
    const id = S.player.equip[slot];
    if (!id) return;
    S.player.equip[slot] = null;
    addItem(id, 1);
    const st = playerStats();
    S.player.hp = Math.min(S.player.hp, st.hp);
    save(); render(); toast('已卸下装备');
  },

  pets: () => go('pets'),

  setPet: uid => {
    S.activePet = uid; save(); render();
    toast('召唤兽已出战', 'good');
  },

  releasePet: uid => {
    const pet = S.pets.find(x => x.uid === uid);
    if (!pet) return;
    confirmBox('放生召唤兽', `确定放生「${pet.name}」吗？此操作不可撤销。`, '放生', () => {
      S.pets = S.pets.filter(x => x.uid !== uid);
      if (S.activePet === uid) S.activePet = S.pets[0] ? S.pets[0].uid : null;
      save(); render();
      toast('已放生');
    });
  },

  tips: () => {
    openSheet(`
      <h3>玩法说明</h3>
      <div class="sub">一图胜千言，且看这份江湖指南</div>
      <div style="font-size:11px;line-height:1.85;color:#b9c8bb">
        <b style="color:#e8cf9c">◆ 历练</b><br>在「秘境」选择地图，点「探索遇敌」进入战斗。等级越高可解锁更深的秘境，击败首领可获得丰厚奖励。<br>
        <b style="color:#e8cf9c">◆ 战斗指令</b><br>攻击：普通物理攻击；法术：消耗法力施放门派技能；道具：战斗中服丹回血；捕捉：收服濒死的野生妖兽；防御：本回合减伤一半；逃跑：七成把握脱身。<br>
        <b style="color:#e8cf9c">◆ 捕捉与召唤兽</b><br>妖兽气血越低越易捕捉，「捆仙索」可再提高 35% 成功率。收服的召唤兽会随战斗成长，同一时间只会有一只出战。<br>
        <b style="color:#e8cf9c">◆ 任务与日常</b><br>主线随章节推进，日常任务每日 0 点重置。完成进度后在「任务」页领取奖励。<br>
        <b style="color:#e8cf9c">◆ 存档</b><br>进度自动保存在本机浏览器（localStorage），更换设备或清理浏览器数据会丢失存档。
      </div>
      <div class="sheet-actions"><button class="btn" data-act="closeSheet">知道了</button></div>`, true);
  },

  master: () => {
    const sct = SECTS[S.player.sect];
    openSheet(`
      <h3>${sct.name} · 师尊</h3>
      <div class="sub">${sct.motto}</div>
      <div style="font-size:11px;line-height:1.8;color:#a9b8ae;margin-bottom:10px">${sct.desc}</div>
      ${sct.skills.map(id => {
        const s = SPELLS[id];
        return `<div class="row"><div class="r-ico" style="font-size:0">${icon('spark')}</div>
          <div class="r-main"><div class="r-name">${s.name} <span class="tag">${s.mp} 法力</span></div>
          <div class="r-desc">${s.desc}</div></div></div>`;
      }).join('')}
      <div class="sheet-actions"><button class="btn" data-act="closeSheet">谨遵师命</button></div>`, true);
  },

  claimMain: () => {
    const mi = mainQuestInfo();
    if (!mi || !mi.done) return toast('尚未完成', 'bad');
    const p = S.player;
    grant(mi.q.rw);
    p.questIdx++;
    save(); render();
  },

  claimDaily: id => {
    const d = DAILIES.find(x => x.id === id);
    const p = S.player;
    if (!d || p.daily.claimed.includes(id)) return;
    if (dailyProgress(d) < d.need) return toast('进度不足', 'bad');
    p.daily.claimed.push(id);
    grant(d.rw);
    save(); render();
  },

  claimActChest: i => {
    const c = ACT_CHESTS[i], dl = S.player.daily;
    if (!c) return;
    dl.actChests = dl.actChests || [];
    if (dl.actChests.includes(i)) return;
    if (dailyAct() < c.at) return toast('活跃度不足', 'bad');
    dl.actChests.push(i);
    grant(c.rw);
    save(); render();
  },

  petBooks: uid => {
    const pet = S.pets.find(x => x.uid === uid);
    if (!pet) return;
    const books = pet.books || [];
    const bagBooks = Object.keys(S.bag).filter(id => ITEMS[id] && ITEMS[id].type === 'book' && S.bag[id] > 0);
    openSheet(`
      <h3>${pet.name} · 打书</h3>
      <div class="sub">资质 ${pet.aptLabel || '乙'} · 灵技 ${books.length} / 3</div>
      <div class="grid2" style="gap:8px;margin-bottom:12px">
        ${books.map(b => `<div class="row" style="margin:0;padding:9px 10px">
          <div class="r-ico" style="width:34px;height:34px;font-size:0">${icon('spark')}</div>
          <div class="r-main"><div class="r-name" style="font-size:12.5px">${b.name}</div>
          <div class="r-desc" style="font-size:10.5px">${b.type === 'heal' ? '治疗' : b.status ? '伤害 + 中毒' : '物理伤害'}</div></div>
        </div>`).join('')}
      </div>
      <div class="sec-title" style="margin-top:0">背包中的技能书</div>
      ${bagBooks.length ? bagBooks.map(id => {
        const it = ITEMS[id];
        return `<div class="row">
          <div class="r-ico">${it.icon}</div>
          <div class="r-main"><div class="r-name">${it.name} <span style="color:#8fa093;font-size:10px">×${S.bag[id]}</span></div>
          <div class="r-desc">${it.desc}</div></div>
          <div class="r-right"><button class="btn sm" data-act="learnBook" data-arg="${uid}|${id}">打书</button></div>
        </div>`;
      }).join('') : '<div class="empty" style="padding:14px">暂无技能书，可去百宝阁购买</div>'}
      <div class="sheet-actions"><button class="btn ghost" data-act="closeSheet">收起</button></div>`, true);
  },

  learnBook: arg => {
    const [uid, id] = (arg || '').split('|');
    const pet = S.pets.find(x => x.uid === uid), it = ITEMS[id];
    if (!pet || !it || bagCount(id) < 1) return;
    const books = pet.books || (pet.books = []);
    const sk = PET_SKILLS[it.petSkill];
    if (!sk) return;
    if (books.some(b => b.name === sk.name)) return toast('已习得此灵技', 'bad');
    if (books.length >= 3) return toast('灵技已满（3 个）', 'bad');
    if (!removeItem(id, 1)) return;
    books.push({ ...sk });
    save();
    toast(`${pet.name} 习得「${sk.name}」`, 'good');
    ACT.petBooks(uid);
    render();
  },

  resetGame: () => {
    confirmBox('重置江湖', '将清空当前角色与所有存档，从头开始。', '重置', () => {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
      S = defaultState();
      openCreate(true);
    });
  },

  pickSect: id => {
    createSel = id;
    document.querySelectorAll('.sect-card').forEach(el => el.classList.toggle('sel', el.dataset.arg === id));
    const info = document.getElementById('sectInfo');
    if (info) info.innerHTML = sectDetail(SECTS[id]);
    const sp = document.getElementById('createSprite');
    if (sp) sp.src = charSprite(id, createGender);
    const nm = document.getElementById('createSectName');
    if (nm) nm.textContent = SECTS[id].name;
  },

  pickName: name => {
    createName = name;
    const box = document.getElementById('nameChips');
    if (box) box.innerHTML = nameChipsHTML();
  },

  pickGender: g => {
    createGender = g;
    const box = document.getElementById('genderChips');
    if (box) box.innerHTML = genderChipsHTML();
    const sp = document.getElementById('createSprite');
    if (sp) sp.src = charSprite(createSel, g);
  },

  rollNames: () => {
    rollNames();
    const box = document.getElementById('nameChips');
    if (box) box.innerHTML = nameChipsHTML();
  },

  createChar: () => {
    let name = (createName || '').trim().slice(0, 8);
    if (!name) name = pick(NAME_POOL);
    S = defaultState();
    S.created = true;
    S.player.name = name;
    S.player.sect = createSel;
    S.player.gender = createGender;
    const st = playerStats();
    S.player.hp = st.hp; S.player.mp = st.mp;
    save(true);
    closeSheet();
    document.getElementById('tabbar').classList.remove('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    go('town');
    setTimeout(() => {
      openSheet(`<h3>序章 · 入世</h3>
        <div class="sub">云阳城外，竹影摇风</div>
        <div style="font-size:11.5px;line-height:1.9;color:#c3d0c4;text-indent:2em">
          你自 ${SECTS[createSel].name} 学艺初成，奉师命下山历练。途经云阳城，听闻城外竹林近来妖气渐盛，往来客商屡遭侵扰。
        </div>
        <div style="font-size:11.5px;line-height:1.9;color:#c3d0c4;text-indent:2em">
          行囊中有几枚丹药，尚无召唤兽相随。且去竹林小径会一会那竹妖，若能收服一只灵兽结伴同行，此行便稳当了。
        </div>
        <div class="sheet-actions"><button class="btn gold" data-act="closeSheet">踏入江湖</button></div>`, true);
    }, 260);
  }
};

function sectDetail(s) {
  return `<div style="font-size:11px;line-height:1.7;color:#c9b98e;padding:2px 4px 4px;letter-spacing:.5px">
    绝技 · ${s.skills.map(id => SPELLS[id].name).join(' / ')}
  </div>`;
}

function shopRow(id) {
  const it = ITEMS[id], p = S.player, q = it.q ? qOf(id) : null;
  const lock = it.type === 'equip' && p.level < it.lv;
  return `<div class="row" ${q ? qStyle(id) : ''}>
    <div class="r-ico">${icon(itemIcon(id))}</div>
    <div class="r-main"><div class="r-name">${it.name}${q ? ` <span style="color:${q.c};font-size:10px;border:1px solid ${q.c}55;padding:0 4px;border-radius:4px">${q.name}</span>` : ''}${lock ? ` <span class="tag off">Lv.${it.lv}</span>` : ''}</div>
    <div class="r-desc">${it.desc}</div></div>
    <div class="r-right" style="display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;color:#e6c384">${icon('coin')}${it.price}</span>
      <button class="btn sm" data-act="buy" data-arg="${id}" ${p.gold < it.price || lock ? 'disabled' : ''}>购买</button>
    </div></div>`;
}

/* ===================== 创角 ===================== */
let createSel = 'tiance';
let createGender = 'm';
let createName = '';
let createNames = [];
const NAME_POOL = ['云清和', '沈墨白', '苏轻寒', '顾长风', '叶知秋', '白小楼', '谢听雨', '陆离', '江晚吟', '宋别鹤'];
function rollNames() {
  createNames = NAME_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 4);

function makeEnemy(spId, level) {
  const sp = SPECIES[spId], st = {};
  STAT_KEYS.forEach(k => st[k] = Math.round(sp.base[k] + sp.grow[k] * (level - 1)));
  if (!sp.boss) {
    st.hp = Math.round(st.hp * 0.74);
    st.atk = Math.round(st.atk * 0.8);
    st.mag = Math.round(st.mag * 0.8);
    st.def = Math.round(st.def * 0.8);
    st.mdef = Math.round(st.mdef * 0.8);
  }
  return {
    uid: 'e' + Math.random().toString(36).slice(2, 7), side: 'enemy', kind: 'enemy', sp: spId,
    name: sp.name, icon: sp.icon, level,
    hp: st.hp, maxhp: st.hp, mp: st.mp, maxmp: st.mp,
    atk: st.atk, def: st.def, mag: st.mag, mdef: st.mdef, spd: st.spd,
    defending: false, buff: 0, boss: !!sp.boss, skill: sp.skill, captured: false,
    st: {}, shield: 0, shieldTurns: 0
  };
}

function startBattle(mode) {
  if (B) return;
  const p = S.player;
  const enc = window._enc; window._enc = null;
  const map = MAPS[enc ? (S.player.scene in MAPS ? S.player.scene : p.map) : p.map] || MAPS.zhulin;
  if (mode === 'boss' && !enc && p.level < map.bossLv - 2) {
    return toast(`需达到 Lv.${map.bossLv - 2} 方可挑战首领`, 'bad');
  }
  ensureVitals();
  const st = playerStats();
  const pu = {
    uid: 'player', side: 'ally', kind: 'player', name: p.name || '少侠', icon: SECTS[p.sect].icon,
    level: p.level, hp: p.hp, maxhp: st.hp, mp: p.mp, maxmp: st.mp,
    atk: st.atk, def: st.def, mag: st.mag, mdef: st.mdef, spd: st.spd,
    defending: false, buff: 0, st: {}, shield: 0, shieldTurns: 0
  };
  const allies = [pu];
  let petUnit = null;
  const pet = activePet();
  if (pet && pet.hp > 0) {
    const ps = petStats(pet);
    petUnit = {
      uid: 'pet', side: 'ally', kind: 'pet', sp: pet.sp, name: pet.name, icon: SPECIES[pet.sp].icon,
      level: pet.level, hp: pet.hp, maxhp: ps.hp, mp: 0, maxmp: 0,
      atk: ps.atk, def: ps.def, mag: ps.mag, mdef: ps.mdef, spd: ps.spd,
      defending: false, buff: 0, st: {}, shield: 0, shieldTurns: 0
    };
    allies.push(petUnit);
  }
  const enemies = [];
  if (enc) {
    const lv = enc.lv || clamp(p.level, 1, 20);
    enemies.push(makeEnemy(enc.sp, lv));
    if (!enc.boss && lv >= 6 && Math.random() < .55) enemies.push(makeEnemy(pick(map.monsters), Math.max(1, lv - 1)));
  } else if (mode === 'boss') {
    enemies.push(makeEnemy(map.boss, map.bossLv));
  } else {
    const n = p.level <= 1 ? 1 : (p.level < 4 ? rnd(1, 2) : rnd(1, 3));
    const lvCap = p.level < 4 ? p.level : 20;
    for (let i = 0; i < n; i++) enemies.push(makeEnemy(pick(map.monsters), clamp(p.level + rnd(-1, 1), 1, lvCap)));
  }
  B = {
    mode, mapId: map.id, allies, player: pu, pet: petUnit, enemies, round: 1,
    sel: enemies[0].uid, busy: false, ended: false, auto: autoOn, result: false, speed: 1, skip: false
  };
  renderBattle();
  blog(`遭遇 ${enemies.map(e => e.name).join('、')}！`);
  if (mode === 'boss') setTimeout(() => toast(`首领「${enemies[0].name}」现身！`, 'bad'), 300);
  if (B.auto) setTimeout(autoAction, 700); else showCmd();
}

function paintBattle() {
  if (!B) return;
  const el = document.getElementById('battle');
  const rd = el.querySelector('#bRound');
  if (rd) rd.textContent = B.round;
  el.querySelectorAll('.unit').forEach(node => {
    const u = findUnit(node.dataset.uid);
    if (!u) return;
    const bar = node.querySelector('.u-hp>i');
    if (bar) bar.style.width = clamp(u.hp / u.maxhp * 100, 0, 100) + '%';
    const num = node.querySelector('.u-num');
    if (num) num.textContent = `${Math.max(0, Math.round(u.hp))}/${u.maxhp}`;
    const st = node.querySelector('.u-stat');
    if (st) st.innerHTML = stIcons(u);
    node.classList.toggle('dead', u.hp <= 0);
    node.classList.toggle('sel', u.side === 'enemy' && u.uid === B.sel && u.hp > 0);
  });
}

function findUnit(uid) {
  return B ? B.allies.concat(B.enemies).find(u => u.uid === uid) : null;
}

  const el = document.getElementById('bLog');

  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transition = 'opacity .2s'; });
}
const aliveEnemies = () => B.enemies.filter(e => e.hp > 0);
const aliveAllies = () => B.allies.filter(a => a.hp > 0);

function currentTarget() {
  const t = B.enemies.find(e => e.uid === B.sel);
  return (t && t.hp > 0) ? t : aliveEnemies()[0];
}
function targetFor(actor) {
  if (actor.side === 'enemy') { const a = aliveAllies(); return a.length ? pick(a) : null; }
  return currentTarget() || null;
}

function damageOf(actor, target, mult, magic) {
  const A = magic ? actor.mag : Math.max(actor.atk, (actor.mag || 0) * 0.8);
  const D = magic ? target.mdef : target.def;
  let base = A * mult - D * 0.55;
  base *= 0.92 + Math.random() * 0.16;
  if (target.defending) base *= 0.5;
  return Math.max(1, Math.round(base));
}

function bwait(ms) {
  if (!B) return sleep(ms);
  if (B.skip) return sleep(6);
  return sleep(ms / (B.speed || 1));
}

async function pulse(uid) {
  const n = document.querySelector(`#battle .unit[data-uid="${uid}"]`);
  if (!n) return;
  n.classList.add('act');
  await bwait(130);
  n.classList.remove('act');
}

function applyStatus(u, type, turns) {
  if (!u || u.hp <= 0) return;
  u.st = u.st || {};
  u.st[type] = { turns, rate: type === 'poison' ? .06 : .08 };
}

function applyDamage(u, dmg, crit, silent) {
  if (u.shield > 0) {
    const ab = Math.min(u.shield, dmg);
    u.shield -= ab; dmg -= ab;
    if (ab > 0) setTimeout(() => toast(`${u.name} 护盾抵消 ${ab}`, 'good'), 60);
  }
  u.hp = Math.max(0, u.hp - dmg);
  paintBattle();
  const node = document.querySelector(`#battle .unit[data-uid="${u.uid}"]`);
  if (node) {
    node.classList.add('hit');
    setTimeout(() => node.classList.remove('hit'), 320);
    const av = node.querySelector('.u-art');
    if (av && B && !B.skip) {
      const s = document.createElement('div');
      s.className = 'slash';
      av.appendChild(s);
      setTimeout(() => s.remove(), 300);
    }
    const f = document.createElement('div');
    f.className = 'floater' + (crit ? ' crit' : '');
    f.textContent = (crit ? '暴击 ' : '-') + dmg;
    const stack = (u._fx = (u._fx || 0) + 1) % 3;
    f.style.left = (50 + (stack - 1) * 13) + '%';
    f.style.animationDelay = (stack * 30) + 'ms';
    (av || node).appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }
  if (B && !B.skip) {
    const stop = performance.now() + 80;
    while (performance.now() < stop) { /* 命中顿帧 */ }
  }
  if (u.hp <= 0 && !u.dead) { u.dead = true; blog(`${u.name} 力竭倒下`); }
}

function applyHeal(u, n) {
  const real = Math.min(u.maxhp - u.hp, Math.round(n));
  u.hp += real;
  paintBattle();
  const node = document.querySelector(`#battle .unit[data-uid="${u.uid}"]`);
  if (node) {
    const f = document.createElement('div');
    f.className = 'floater heal';
    f.textContent = '+' + real;
    (node.querySelector('.u-art') || node).appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }
  return real;
}

  let c = (1 - t.hp / t.maxhp) * 0.62 + 0.1;

  if (net) c += 0.35;
  return clamp(c, 0.05, 0.95);
}

/* 回合结束：持续伤害与状态结算 */
async function tickStatuses() {
  if (!B || B.ended) return;
  const units = B.allies.concat(B.enemies).filter(u => u.hp > 0);
  for (const u of units) {
    if (!B || B.ended) return;
    const st = u.st || {};
    for (const k of ['poison', 'burn']) {
      if (st[k] && st[k].turns > 0) {
        const dmg = Math.max(2, Math.round(u.maxhp * st[k].rate));
        applyDamage(u, dmg, false, true);
        blog(`${u.name} 受${k === 'poison' ? '中毒' : '灼烧'}侵蚀，损失 ${dmg} 气血`);
        st[k].turns--;
        if (st[k].turns <= 0) delete st[k];
        await bwait(180);
        if (checkEnd()) return;
      }
    }
    if (u.shield > 0) {
      u.shieldTurns = (u.shieldTurns || 0) - 1;
      if (u.shieldTurns <= 0) { u.shield = 0; u.shieldTurns = 0; }
    }
    paintBattle();
  }
}

/* 回合推进 */
async function playerAction(act) {
  if (!B || B.busy || B.ended) return;
  B.busy = true;
  const w = document.getElementById('cmdWrap');
  if (w) w.innerHTML = '<div class="turn-wait"><i></i><span>回合结算中</span></div>';
  const order = [{ u: B.player, act }];
  if (B.pet && B.pet.hp > 0) order.push({ u: B.pet, act: petAI(B.pet) });
  aliveEnemies().forEach(e => order.push({ u: e, act: enemyAI(e) }));
  order.sort((a, b) => (b.u.spd - a.u.spd) + (Math.random() - 0.5) * 2);
  await sleep(B.skip ? 0 : 45);
  for (const it of order) {
    if (!B || B.ended) break;
    if (it.u.hp <= 0) continue;
    await executeAction(it.u, it.act);
    await bwait(210);
    if (checkEnd()) break;
  }
  if (!B || B.ended) return;
  await tickStatuses();
  if (!B || B.ended) return;
  B.allies.forEach(a => a.defending = false);
  B.enemies.forEach(e => e.defending = false);
  if (B.pet && B.pet.buff > 0) B.pet.buff--;
  B.round++;
  B.busy = false;
  paintBattle();
  if (B.auto) { await bwait(380); autoAction(); }
  else showCmd();
}

function petAI(pet) {
  const sp = SPECIES[pet.sp];
  const books = (pet.books && pet.books.length) ? pet.books : [sp.skill];
  const heal = books.find(b => b.type === 'heal');
  if (heal && B.player.hp < B.player.maxhp * 0.85) return { type: 'petskill', book: heal };
  const atkBooks = books.filter(b => b.type !== 'heal');
  if (atkBooks.length && Math.random() < 0.72) return { type: 'petskill', book: pick(atkBooks) };
  return { type: 'attack' };
}

function enemyAI(e) {
  if (e.skill && e.skill.type !== 'heal' && Math.random() < 0.42) return { type: 'eskill' };
  return { type: 'attack' };
}

async function executeAction(actor, act) {
  if (!B || B.ended) return;
  if (actor.st && actor.st.stun && actor.st.stun.turns > 0) {
    blog(`${actor.name} 眩晕中，无法行动`);
    await bwait(240);
    return;
  }
  if (act.type === 'attack') {
    const t = targetFor(actor);
    if (!t) return;
    await pulse(actor.uid);
    const crit = Math.random() < 0.12;
    let dmg = damageOf(actor, t, 1.1, false);
    if (actor.buff > 0) dmg = Math.round(dmg * 1.6);
    if (crit) dmg = Math.round(dmg * 1.6);
    applyDamage(t, dmg, crit);
    blog(`${actor.name} 挥击 ${t.name}，造成 ${dmg} 点伤害`);
    return;
  }

  if (act.type === 'petskill') {
    const sp = SPECIES[actor.sp];
    if (!sp) return;
    const sk = act.book || sp.skill;
    if (sk.type === 'heal') {
      const t = B.player;
      await pulse(actor.uid);
      const heal = applyHeal(t, actor.mag * sk.mult + 22);
      blog(`${actor.name} 施放「${sk.name}」，为 ${t.name} 回复 ${heal} 气血`);
    } else if (sk.type === 'magic') {
      const t = currentTarget();
      if (!t) return;
      await pulse(actor.uid);
      let dmg = damageOf(actor, t, sk.mult, true);
      if (actor.buff > 0) dmg = Math.round(dmg * 1.6);
      applyDamage(t, dmg, false);
      blog(`${actor.name} 施放「${sk.name}」，${t.name} 受到 ${dmg} 点法术伤害`);
    } else {
      const t = currentTarget();
      if (!t) return;
      await pulse(actor.uid);
      let dmg = damageOf(actor, t, sk.mult, false);
      if (actor.buff > 0) dmg = Math.round(dmg * 1.6);
      const crit = Math.random() < 0.1;
      if (crit) dmg = Math.round(dmg * 1.5);
      applyDamage(t, dmg, crit);
      if (sk.status && Math.random() < .7) applyStatus(t, sk.status, 3);
      blog(`${actor.name} 施放「${sk.name}」，${t.name} 受到 ${dmg} 点伤害`);
    }
    return;
  }

  if (act.type === 'eskill') {
    const t = targetFor(actor);
    if (!t) return;
    await pulse(actor.uid);
    const magic = actor.skill.type === 'magic';
    let dmg = damageOf(actor, t, actor.skill.mult, magic);
    applyDamage(t, dmg, false);
    const inf = { duanlang: 'poison', tongjia: 'poison', huoyou: 'burn', shuimu: 'stun', fengyao: 'burn' }[actor.sp];
    if (inf && Math.random() < .4) applyStatus(t, inf, inf === 'stun' ? 1 : 3);
    blog(`${actor.name} 施放「${actor.skill.name}」，${t.name} 受到 ${dmg} 点${magic ? '法术' : ''}伤害`);
    return;
  }

  if (act.type === 'skill') {
    const s = SPELLS[act.skill];
    if (!s) return;
    if (B.player.mp < s.mp) { blog('法力不足，无法施法'); return; }
    B.player.mp -= s.mp;
    if (s.type === 'heal') {
      const real = applyHeal(B.player, B.player.mag * s.mult + 40);
      await pulse('player');
      blog(`你施放「${s.name}」，回复 ${real} 点气血`);
    } else if (s.type === 'healall') {
      await pulse('player');
      let sum = 0;
      B.allies.filter(a => a.hp > 0).forEach(a => sum += applyHeal(a, B.player.mag * s.mult + 30));
      blog(`你施放「${s.name}」，同伴共回复 ${sum} 点气血`);
    } else if (s.type === 'shield') {
      await pulse('player');
      B.player.shield = Math.round(B.player.mag * s.mult + 60);
      B.player.shieldTurns = 3;
      showCombo(s.name);
      if (s.name === '龙鳞护体') B.player.mp = Math.min(B.player.maxmp, B.player.mp + 12);
      blog(`你施展「${s.name}」，获得 ${B.player.shield} 点护盾（3 回合）`);
      paintBattle();
    } else if (s.type === 'shieldall') {
      await pulse('player');
      const amount = Math.round(B.player.mag * s.mult + 45);
      B.allies.filter(a => a.hp > 0).forEach(a => { a.shield = amount; a.shieldTurns = 3; });
      showCombo(s.name);
      blog(`你施展「${s.name}」，全体同伴获得 ${amount} 点护盾`);
      paintBattle();
    } else if (s.type === 'buffpet') {
      await pulse('player');
      if (B.pet && B.pet.hp > 0) {
        B.pet.buff = 4;
        showCombo('兽王令');
        blog(`你号令万兽，${B.pet.name} 攻击提升 60%（3 回合）`);
        paintBattle();
      } else {
        blog('你施展兽王令，却无召唤兽可听令');
      }
    } else if (s.type === 'combo') {
      const t = currentTarget();
      if (!t) return;
      await pulse('player');
      showCombo('万兽奔腾');
      let dmg = damageOf(B.player, t, s.mult, false);
      applyDamage(t, dmg, false);
      if (B.pet && B.pet.hp > 0) {
        const d2 = damageOf(B.pet, t, 1.2, false);
        setTimeout(() => applyDamage(t, d2, false), 180);
        blog(`你与 ${B.pet.name} 合击 ${t.name}，共造成 ${dmg + d2} 点伤害`);
      } else {
        blog(`你独自扑向 ${t.name}，造成 ${dmg} 点伤害`);
      }
    } else {
      const magic = s.type === 'magic' || s.type === 'magicall';
      const targets = (s.target === 'all' || s.type === 'magicall') ? aliveEnemies() : [currentTarget()].filter(Boolean);
      await pulse('player');
      showCombo(s.name);
      let total = 0;
      for (const t of targets) {
        if (!t || t.hp <= 0) continue;
        const crit = Math.random() < 0.1;
        let dmg = damageOf(B.player, t, s.mult, magic);
        if (crit) dmg = Math.round(dmg * 1.5);
        applyDamage(t, dmg, crit);
        if (s.status) {
          const ch = s.status.chance == null ? 1 : s.status.chance;
          if (Math.random() < ch) applyStatus(t, s.status.t, s.status.turns);
        }
        total += dmg;
      }
      blog(`你施放「${s.name}」，共造成 ${total} 点${magic ? '法术' : ''}伤害`);
      if (s.status && Math.random() < .5) toast('状态已附加', 'good');
    }
    renderTop();
    return;
  }

  if (act.type === 'item') {
    const it = ITEMS[act.item];
    if (!it || bagCount(act.item) < 1) return;
    const real = it.hp ? applyHeal(B.player, it.hp) : 0;
    if (it.mp) B.player.mp = Math.min(B.player.maxmp, B.player.mp + it.mp);
    if (it.exp) { const ups = addExp(it.exp); if (ups.length) toast(`修为精进，已达 Lv.${S.player.level}`, 'good'); }
    removeItem(act.item, 1);
    paintBattle();
    blog(`你服下「${it.name}」${real ? '，回复 ' + real + ' 点气血' : ''}`);
    return;
  }

  if (act.type === 'capture') {
    const t = currentTarget();
    if (!t || t.hp <= 0) return;
    if (t.boss) { blog('首领威压太盛，无法捕捉'); return; }
    const sp = SPECIES[t.sp];
    if (!sp.pet) { blog('此妖兽无法捕捉'); return; }
    if (S.pets.length >= 6) { blog('兽栏已满（最多 6 只），无法再收服'); return; }
    if (act.net) {
      if (!removeItem('net', 1)) { blog('捆仙索不足'); return; }
    }
    await pulse('player');
    const chance = captureChance(t, act.net);
    if (Math.random() < chance) {
      t.captured = true; t.hp = 0; 
      const pet = makePet(t.sp, t.level);
      S.pets.push(pet);
      if (S.activePet == null) S.activePet = pet.uid;
      S.player.captures++;
      S.player.daily.captures++;
      save();
      paintBattle();
      showCombo('收服成功');
      blog(`成功收服 ${sp.name}（Lv.${t.level}）！`);
      setTimeout(() => toast(`收服 ${sp.name}！已收入兽栏`, 'good'), 500);
    } else {
      blog(`捕捉失败，${sp.name} 挣脱了${act.net ? '捆仙索' : ''}`);
      setTimeout(() => toast('捕捉失败', 'bad'), 200);
    }
    return;
  }

  if (act.type === 'defend') {
    actor.defending = true;
    blog(`${actor.name} 凝神防御，本回合受伤减半`);
    return;
  }

  if (act.type === 'flee') {
    await pulse('player');
    if (Math.random() < 0.7) {
      B.ended = true;
      blog('你且战且退，成功脱离战斗');
      setTimeout(() => { endBattle(); go(lastWorldScene || 'town'); toast('已脱离战斗'); }, 500);
    } else {
      blog('逃跑失败，被妖兽拦住了去路');
    }
    return;
  }
}

function checkEnd() {
  if (!B || B.ended) return true;
  if (B.player.hp <= 0) { B.ended = true; setTimeout(finishLose, 450); return true; }
  if (B.enemies.every(e => e.hp <= 0)) { B.ended = true; setTimeout(finishWin, 420); return true; }
  return false;
}

function syncVitals() {
  if (!B) return;
  S.player.hp = Math.max(0, Math.round(B.player.hp));
  S.player.mp = Math.max(0, Math.min(B.player.maxmp, Math.round(B.player.mp)));
  const pet = activePet();
  if (pet && B.pet) pet.hp = Math.max(0, Math.round(B.pet.hp));
}

function finishWin() {
  if (!B || B.result) return;
  B.result = true;
  syncVitals();
  const p = S.player, map = MAPS[B.mapId];
  let exp = 0, gold = 0, killCount = 0;
  B.enemies.forEach(e => {
    if (e.captured) return;
    const sp = SPECIES[e.sp];
    exp += Math.round((28 + 19 * e.level) * sp.exp);
    gold += Math.round((14 + 9 * e.level) * sp.gold);
    p.kills[e.sp] = (p.kills[e.sp] || 0) + 1;
    p.daily.kills++;
    killCount++;
  });
  p.daily.battles++;
  p.wins++;
  p.gold += gold;
  const drops = {};
  const boss = B.mode === 'boss';
  const dropN = boss ? 2 : (Math.random() < 0.4 ? 1 : 0);
  for (let i = 0; i < dropN; i++) {
    const id = pick(map.drops);
    drops[id] = (drops[id] || 0) + 1;
    S.bag[id] = (S.bag[id] || 0) + 1;
  }
  const ups = addExp(exp);
  let petMsg = '';
  const pet = activePet();
  if (pet && B.pet && B.pet.hp > 0) {
    const pexp = Math.round(exp * 0.75);
    const pu = addPetExp(pet, pexp);
    petMsg = `${pet.name} 获得 ${pexp} 经验${pu ? `，升至 Lv.${pet.level}` : ''}`;
  }
  save(true);
  const dropChips = Object.keys(drops).map(id => `<span class="rw">${ITEMS[id].icon} ${ITEMS[id].name}×${drops[id]}</span>`).join('');
  openSheet(`
    <div class="result">
      <div class="rttl">战斗胜利</div>
      <div class="rsub">${boss ? '首领伏诛 · 一方太平' : '妖魔授首 · 历练有成'}</div>
      <div class="reward-grid">
        <span class="rw">✨ 经验 +${exp}</span>
        <span class="rw">🪙 银两 +${gold}</span>
        ${dropChips}
      </div>
      ${ups.length ? `<div style="font-size:11px;color:#f0d49a;margin-top:8px">境界提升！已达 Lv.${p.level}</div>` : ''}
      ${petMsg ? `<div style="font-size:10px;color:#9ec9a8;margin-top:6px">${petMsg}</div>` : ''}
      <div class="sheet-actions" style="margin-top:16px">
        <button class="btn ghost" data-act="battleTown">返回城镇</button>
        <button class="btn gold" data-act="battleAgain">继续探索</button>
      </div>
    </div>`, true);
  renderTop();
}

function finishLose() {
  if (!B) return;
  B.result = true;
  syncVitals();
  const p = S.player, st = playerStats();
  const loss = Math.floor(p.gold * 0.1);
  p.gold = Math.max(0, p.gold - loss);
  p.hp = Math.max(1, Math.round(st.hp * 0.3));
  p.mp = Math.max(0, Math.round(st.mp * 0.3));
  S.pets.forEach(pet => pet.hp = Math.max(1, Math.round(petStats(pet).hp * 0.3)));
  save(true);
  openSheet(`
    <div class="result">
      <div class="rttl" style="color:#e9a79b">力竭倒地</div>
      <div class="rsub">幸得路人相救，送回云阳城</div>
      <div class="reward-grid"><span class="rw" style="border-color:rgba(210,110,100,.4);color:#f0b8ac">🪙 遗落银两 ${loss}</span></div>
      <div style="font-size:10.5px;color:#9fb0a5;line-height:1.8;margin-top:8px">建议先提升等级、装备与丹药，或收服一只召唤兽同行。</div>
      <div class="sheet-actions" style="margin-top:14px">
        <button class="btn wide gold" data-act="battleTown">返回城镇疗伤</button>
      </div>
    </div>`, true);
  renderTop();
}

function endBattle() {
  if (B) {
    syncVitals();
    const pet = activePet();
    if (pet && B.pet) pet.hp = Math.max(0, Math.round(B.pet.hp));
  }
  B = null;
  const el = document.getElementById('battle');
  el.classList.add('hidden');
  el.innerHTML = '';
  closeSheet();
  save(true);
  ensureVitals();
  render();
}

function autoAction() {
  if (!B || B.ended || B.busy) return;
  const p = S.player, sct = SECTS[p.sect], st = playerStats();
  const healSkill = sct.skills.find(id => ['heal', 'healall'].includes(SPELLS[id].type));
  let act;
  if (healSkill && p.hp < st.hp * 0.5 && p.mp >= SPELLS[healSkill].mp) {
    act = { type: 'skill', skill: healSkill };
  } else if (p.hp < st.hp * 0.35) {
    const potion = ['hp2', 'hp1'].find(id => bagCount(id) > 0);
    act = potion ? { type: 'item', item: potion } : { type: 'attack' };
  } else {
    const dmgSkills = sct.skills.filter(id => ['phys', 'magic', 'combo'].includes(SPELLS[id].type) && p.mp >= SPELLS[id].mp);
    if (dmgSkills.length && Math.random() < 0.8) act = { type: 'skill', skill: pick(dmgSkills) };
    else act = { type: 'attack' };
  }
  playerAction(act);
}

Object.assign(ACT, {
  explore: () => startBattle('normal'),
  challengeBoss: () => startBattle('boss'),
  startBattle: m => startBattle(m),
  selectTarget: uid => {
    if (!B || B.busy || B.ended) return;
    const u = findUnit(uid);
    if (!u || u.hp <= 0) return;
    B.sel = uid; paintBattle();
  },
  bAttack: () => { const t = currentTarget(); if (!t) return; playerAction({ type: 'attack' }); },
  bSkill: () => { if (B && !B.busy && !B.ended) skillPanel(); },
  bItem: () => { if (B && !B.busy && !B.ended) itemPanel(); },
  bCapture: () => { if (B && !B.busy && !B.ended) capturePanel(); },
  bDefend: () => playerAction({ type: 'defend' }),
  bFlee: () => playerAction({ type: 'flee' }),
  doSkill: id => { playerAction({ type: 'skill', skill: id }); },
  doItem: id => { playerAction({ type: 'item', item: id }); },
  doCapture: mode => { playerAction({ type: 'capture', net: mode === 'net' }); },
  backCmd: () => { if (B && !B.busy && !B.ended) { showCmd(); paintBattle(); } },
  toggleAuto: () => {
    if (!B) return;
    B.auto = !B.auto;
    autoOn = B.auto;
    const btn = document.querySelector('#battle .auto');
    if (btn) { btn.classList.toggle('on', B.auto); btn.innerHTML = '自动 ' + (B.auto ? '◉' : '○'); }
    toast(B.auto ? '已开启自动战斗' : '已关闭自动战斗');
    if (B.auto && !B.busy && !B.ended) autoAction();
  },
  cycleSpeed: () => {
    if (!B) return;
    B.speed = B.speed === 1 ? 2 : B.speed === 2 ? 3 : 1;
    const btn = document.querySelector('#battle .speed');
    if (btn) btn.textContent = B.speed + 'x';
    toast('战斗速度 ' + B.speed + 'x');
  },
  skipBattle: () => {
    if (!B || B.ended) return;
    B.skip = true; B.speed = 3; B.auto = true; autoOn = true;
    const btn = document.querySelector('#battle .speed');
    if (btn) btn.textContent = '3x';
    toast('已跳过战斗动画');
    if (!B.busy) autoAction();
  },
  battleAgain: () => { const m = B ? B.mode : 'normal'; endBattle(); startBattle(m); },
  battleTown: () => { endBattle(); go(lastWorldScene || 'town'); }
});

/* 初始位置 + 兜底（防止战斗面板在没有 B 时残留） */
function boot() {
  const setH = () => {
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  };
  setH();
  window.addEventListener('resize', setH);
  window.addEventListener('pageshow', setH);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setH);
  window.addEventListener('orientationchange', () => { setH(); setTimeout(setH, 120); setTimeout(setH, 400); });
  // iOS 键盘弹出时，确保输入框不被遮挡，收起后复位视口
  document.addEventListener('focusin', e => {
    if (e.target && e.target.id === 'nameInput') {
      setTimeout(() => { try { e.target.scrollIntoView({ block: 'center' }); } catch (err) { } }, 280);
    }
  });
  document.addEventListener('focusout', e => {
    if (e.target && e.target.id === 'nameInput') {
      setTimeout(() => { window.scrollTo(0, 0); }, 120);
    }
  });

  loadSave();
  if (!S.created) {
    openCreate();
  } else {
    ensureVitals();
    S.tab = S.tab || 'town';
    go(S.tab);
  }
  // 每 30 秒自动存档
  setInterval(() => save(true), 30000);
}

boot();
</script>
